<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - Final Legacy</title>
    <style>
        :root { 
            --bg: #000000; --text: #ffffff; --accent: #3742fa; 
            --ready: #ff4757; --go: #2ed573; --subtext: #888;
        }
        /* 十二種專業主題配色 */
        body.dark-theme { --bg: #000; --text: #fff; --accent: #3742fa; }
        body.light-theme { --bg: #fff; --text: #000; --accent: #007bff; }
        body.cyber-theme { --bg: #0d0221; --text: #00f2ff; --accent: #ff0055; }
        body.forest-theme { --bg: #1b2e1b; --text: #78e08f; --accent: #2d4a2d; }
        body.sakura-theme { --bg: #fff5f8; --text: #d4418e; --accent: #ff85a2; }
        body.gold-theme { --bg: #1a1a1a; --text: #d4af37; --accent: #ffd700; }
        body.ocean-theme { --bg: #001219; --text: #94d2bd; --accent: #005f73; }
        body.midnight-theme { --bg: #000; --text: #444; --accent: #222; }
        body.lava-theme { --bg: #2b0000; --text: #ff9f1a; --accent: #ff4757; }
        body.purple-theme { --bg: #240046; --text: #9d4edd; --accent: #3c096c; }
        body.mint-theme { --bg: #f0fff4; --text: #22543d; --accent: #38a169; }
        body.slate-theme { --bg: #1e293b; --text: #94a3b8; --accent: #334155; }

        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; user-select: none; transition: background 0.3s; }

        /* 頂部按鈕與狀態 (參考 image_ab7b15.png) */
        #top-nav { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; z-index: 100; }
        .icon-box { background: rgba(255,255,255,0.1); border-radius: 8px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .icon-box:hover { background: rgba(255,255,255,0.2); }
        .user-tag { background: #1a1a1a; border-radius: 4px; padding: 4px 8px; color: #2ed573; font-size: 12px; height: fit-content; margin-top: 10px; }

        /* 側邊欄 (參考 image_aa9e38.png) */
        #side-panel { width: 300px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; transform: translateX(-300px); transition: 0.3s; position: absolute; height: 100%; z-index: 200; }
        #side-panel.active { transform: translateX(0); }
        .side-header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }

        /* 計時器主體 */
        #main-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #timer-display { font-size: 22vw; font-weight: 700; font-variant-numeric: tabular-nums; }
        #scramble-box { position: absolute; top: 80px; font-size: 1.2rem; color: var(--subtext); text-align: center; max-width: 80%; }

        /* 好友與設定 Tab */
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #555; cursor: pointer; font-weight: bold; }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        
        /* 彈窗樣式 */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 25px; border-radius: 12px; z-index: 3000; display: none; width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .modal.active { display: block; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2500; display:none; }
        .overlay.active { display:block; }

        input, select { width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: white; border-radius: 5px; margin: 8px 0; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body class="dark-theme">

<div id="top-nav">
    <div class="icon-box" onclick="toggleSide()">☰</div>
    <div class="icon-box" onclick="openModal('settings-modal')">⚙️</div>
    <div class="user-tag" id="user-display">未登入</div>
</div>

<div id="side-panel">
    <div class="side-header">
        <div style="display:flex; gap:10px;">
            <div class="icon-box" style="width:30px; height:30px;" onclick="switchSideTab('friends')">👥</div>
            <div class="icon-box" style="width:30px; height:30px;" onclick="switchSideTab('history')">📜</div>
        </div>
        <button onclick="toggleSide()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
    </div>
    
    <div id="side-content" style="padding:15px; flex:1; overflow-y:auto;">
        </div>
</div>

<div id="main-stage">
    <div id="scramble-box">正在生成打亂公式...</div>
    <div id="timer-display">0.000</div>
</div>

<div class="overlay" onclick="closeAllModals()"></div>

<div class="modal" id="settings-modal">
    <h3 id="lang-title">設定</h3>
    
    <label id="lang-label">語言 / Language</label>
    <select id="lang-select" onchange="updateLanguage()">
        <option value="zh-TW">繁體中文</option>
        <option value="zh-CN">簡體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="hi">हिन्दी</option>
        <option value="es">Español</option>
    </select>

    <label id="theme-label">主題顏色</label>
    <select id="theme-select" onchange="updateTheme()">
        <option value="dark">預設深色</option><option value="light">明亮模式</option>
        <option value="cyber">賽博龐克</option><option value="forest">森林木紋</option>
        <option value="sakura">粉色櫻花</option><option value="gold">黑金尊爵</option>
        <option value="midnight">極致全黑</option><option value="lava">烈焰岩漿</option>
    </select>

    <label id="dec-label">小數點位數</label>
    <select id="dec-select">
        <option value="2">2 位</option>
        <option value="3" selected>3 位</option>
    </select>

    <button class="btn" onclick="googleLogin()" id="login-btn">Google 登入</button>
    <button class="btn" style="background:#444" onclick="closeAllModals()">OK</button>
</div>

<script>
    // --- 核心變數 ---
    let timerState = "IDLE";
    let startTime, timerInterval, holdTimeout;
    let currentScramble = "";
    let solves = JSON.parse(localStorage.getItem('solves')) || [];

    const langData = {
        "zh-TW": { title: "設定", lang: "語言", theme: "主題顏色", dec: "小數點位數", login: "Google 登入" },
        "en": { title: "Settings", lang: "Language", theme: "Theme", dec: "Decimals", login: "Login with Google" },
        "ja": { title: "設定", lang: "言語", theme: "テーマ", dec: "小数点", login: "Googleでログイン" },
        "hi": { title: "सेटिंग्स", lang: "भाषा", theme: "थीम", dec: "दशमलव", login: "Google से लॉगिन" },
        "es": { title: "Ajustes", lang: "Idioma", theme: "Tema", dec: "Decimales", login: "Iniciar con Google" }
    };

    // --- 設定功能：真正有效 ---
    function updateLanguage() {
        const l = document.getElementById('lang-select').value;
        const d = langData[l] || langData["zh-TW"];
        document.getElementById('lang-title').innerText = d.title;
        document.getElementById('lang-label').innerText = d.lang;
        document.getElementById('theme-label').innerText = d.theme;
        document.getElementById('dec-label').innerText = d.dec;
        document.getElementById('login-btn').innerText = d.login;
        localStorage.setItem('lang', l);
    }

    function updateTheme() {
        const t = document.getElementById('theme-select').value;
        document.body.className = t + "-theme";
        localStorage.setItem('theme', t);
    }

    // --- 計時器邏輯 ---
    function generateScramble() {
        const moves = ["U","D","L","R","F","B"];
        let res = [];
        for(let i=0; i<20; i++){
            let m = moves[Math.floor(Math.random()*moves.length)];
            res.push(m + ["","'","2"][Math.floor(Math.random()*3)]);
        }
        currentScramble = res.join(" ");
        document.getElementById('scramble-box').innerText = currentScramble;
    }

    const display = document.getElementById('timer-display');
    window.onkeydown = (e) => {
        if(e.code === 'Space'){
            e.preventDefault();
            if(timerState === "RUNNING") {
                clearInterval(timerInterval);
                timerState = "IDLE";
                saveSolve();
                generateScramble();
            } else if(timerState === "IDLE") {
                timerState = "READY";
                display.style.color = "var(--ready)";
                holdTimeout = setTimeout(() => {
                    timerState = "GO";
                    display.style.color = "var(--go)";
                    display.innerText = (0).toFixed(document.getElementById('dec-select').value);
                }, 500);
            }
        }
    };

    window.onkeyup = (e) => {
        if(e.code === 'Space'){
            clearTimeout(holdTimeout);
            if(timerState === "GO") {
                startTime = performance.now();
                timerInterval = setInterval(() => {
                    let now = (performance.now() - startTime) / 1000;
                    display.innerText = now.toFixed(document.getElementById('dec-select').value);
                }, 10);
                timerState = "RUNNING";
                display.style.color = "var(--text)";
            } else {
                timerState = "IDLE";
                display.style.color = "var(--text)";
            }
        }
    };

    function saveSolve() {
        const time = display.innerText;
        solves.unshift({ time, scramble: currentScramble, date: new Date() });
        localStorage.setItem('solves', JSON.stringify(solves));
    }

    // --- UI 控制 ---
    function toggleSide() { document.getElementById('side-panel').classList.toggle('active'); }
    function openModal(id) { 
        document.getElementById(id).classList.add('active'); 
        document.querySelector('.overlay').classList.add('active');
    }
    function closeAllModals() { 
        document.querySelectorAll('.modal, .overlay').forEach(el => el.classList.remove('active')); 
    }

    // 初始化
    window.onload = () => {
        if(localStorage.getItem('theme')) updateTheme(document.getElementById('theme-select').value = localStorage.getItem('theme'));
        if(localStorage.getItem('lang')) updateLanguage(document.getElementById('lang-select').value = localStorage.getItem('lang'));
        generateScramble();
    }
</script>

</body>
</html>
