<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - Professional Legacy</title>
    <style>
        :root { 
            --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; 
            --ready: #ff4757; --go: #2ed573; --subtext: #888; --border: #333;
        }
        /* 主題配色 */
        body.dark-theme { --bg: #121212; --panel: #1e1e1e; --accent: #3742fa; }
        body.light-theme { --bg: #f5f5f5; --panel: #fff; --text: #333; --accent: #007bff; --border: #ddd; }
        body.cyber-theme { --bg: #0d0221; --panel: #261447; --text: #ff0055; --accent: #00f2ff; }
        body.sakura-theme { --bg: #fff5f8; --panel: #ffe0e9; --text: #d4418e; --accent: #ff85a2; }
        body.gold-theme { --bg: #1a1a1a; --panel: #2c2c2c; --text: #d4af37; --accent: #ffd700; }
        body.midnight-theme { --bg: #000; --panel: #111; --accent: #444; }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; user-select: none; }

        /* 左側導航 */
        #social-bar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        #social-bar.collapsed { transform: translateX(-320px); position: absolute; height: 100%; }
        .nav-header { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.2); }
        .icon-btn { font-size: 18px; cursor: pointer; background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .icon-btn:hover { background: var(--accent); }

        .f-tabs { display: flex; background: rgba(0,0,0,0.1); }
        .f-tab-btn { flex: 1; padding: 12px; background: none; border: none; color: var(--subtext); cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent; }
        .f-tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: rgba(255,255,255,0.05); }

        /* 主畫面 */
        #main-stage { flex: 1; display: flex; flex-direction: column; text-align: center; position: relative; }
        #top-area { padding: 25px; }
        #scramble { font-size: 1.1rem; min-height: 80px; color: var(--subtext); max-width: 85%; margin: 0 auto; line-height: 1.5; word-break: break-all; }
        #timer-display { font-size: 14vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; transition: color 0.1s; cursor: pointer; }
        
        #stats-bar { display: flex; justify-content: center; gap: 40px; padding: 20px; font-size: 1.2rem; background: rgba(0,0,0,0.05); }
        #stats-bar b { color: var(--accent); }
        
        /* 歷史紀錄 */
        #history-panel { width: 280px; background: rgba(0,0,0,0.1); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .history-header { padding: 15px; font-weight: bold; border-bottom: 1px solid var(--border); }
        #solve-list-ui { flex: 1; overflow-y: auto; }
        .solve-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .solve-item:hover { background: rgba(255,255,255,0.05); }

        /* 設定彈窗 */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); border-radius: 15px; z-index: 3000; display: none; width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); overflow: hidden; border: 1px solid var(--border); }
        .modal.active { display: block; }
        .modal-nav { display: flex; background: rgba(0,0,0,0.2); }
        .modal-tab { flex: 1; padding: 15px; border: none; background: none; color: var(--subtext); cursor: pointer; font-weight: bold; }
        .modal-tab.active { color: var(--accent); background: var(--panel); }
        .modal-content { padding: 25px; max-height: 70vh; overflow-y: auto; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2500; display:none; }
        .overlay.active { display:block; }

        label { display: block; margin-top: 15px; font-size: 0.9rem; color: var(--subtext); }
        input, select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; border-radius: 8px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body class="dark-theme">

<div class="overlay" id="modal-overlay" onclick="closeAllModals()"></div>

<div id="social-bar">
    <div class="nav-header">
        <button class="icon-btn" id="hide-sidebar-btn">☰</button>
        <button class="icon-btn" onclick="openModal('modal-settings')">⚙️</button>
    </div>
    <div id="user-info-card" style="padding: 20px; border-bottom: 1px solid var(--border);">
        <div id="display-name-side" data-i18n="guest">未登入</div>
        <div id="display-id-side" style="font-size: 0.85rem; color: var(--accent); margin-top: 4px;">#Guest</div>
    </div>
    <div class="f-tabs">
        <button class="f-tab-btn active" onclick="switchF(event, 'f-list')" data-i18n="f_list">好友列表</button>
        <button class="f-tab-btn" onclick="switchF(event, 'f-apply')" data-i18n="f_apply">申請</button>
    </div>
    <div id="f-list" class="f-pane" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
    <div id="f-apply" class="f-pane" style="display: none; padding: 20px;">
        <input type="text" id="target-id-input" placeholder="ID...">
        <button class="btn" onclick="sendRequest()" data-i18n="send_req">發送申請</button>
    </div>
</div>

<div id="main-stage">
    <button class="icon-btn" id="show-sidebar-btn" style="position:absolute; left:15px; top:15px; display:none;">☰</button>
    <div id="top-area">
        <select id="event-selector" style="width: auto; background: var(--accent); min-width: 120px;">
            <option value="333">3x3x3</option>
            <option value="222">2x2x2</option>
            <option value="444">4x4x4</option>
            <option value="555">5x5x5</option>
            <option value="666">6x6x6</option>
            <option value="777">7x7x7</option>
            <option value="pyram">Pyraminx</option>
            <option value="skewb">Skewb</option>
            <option value="mega">Megaminx</option>
        </select>
        <div id="scramble">Generating...</div>
    </div>

    <div id="timer-display">0.000</div>

    <div id="stats-bar">
        <div>AO5: <b id="ao5-val">--</b></div>
        <div>AO12: <b id="ao12-val">--</b></div>
    </div>
</div>

<div id="history-panel">
    <div class="history-header" data-i18n="history">歷史成績</div>
    <div id="solve-list-ui"></div>
</div>

<div class="modal" id="modal-settings">
    <div class="modal-nav">
        <button class="modal-tab active" onclick="switchST(event, 'st-acc')" data-i18n="tab_acc">帳號</button>
        <button class="modal-tab" onclick="switchST(event, 'st-ui')" data-i18n="tab_ui">顯示</button>
        <button class="modal-tab" onclick="switchST(event, 'st-timer')" data-i18n="tab_timer">計時器</button>
    </div>
    <div class="modal-content">
        <div id="st-acc" class="tab-pane active">
            <div id="login-sec"><button class="btn" onclick="login()">Google Login</button></div>
            <div id="prof-sec" style="display:none;">
                <label data-i18n="edit_name">修改名字</label><input type="text" id="name-in">
                <label data-i18n="edit_id">修改 ID</label><input type="text" id="id-in">
                <button class="btn" onclick="saveProfile()" data-i18n="save">儲存</button>
                <button class="btn" style="background:#444;" onclick="logout()" data-i18n="logout">登出</button>
            </div>
        </div>
        <div id="st-ui" class="tab-pane">
            <label data-i18n="lang">語言 Language</label>
            <select id="lang-sel" onchange="changeLang(this.value)">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
                <option value="jp">日本語</option>
            </select>
            <label data-i18n="theme">主題顏色</label>
            <select onchange="document.body.className=this.value+'-theme'">
                <option value="dark">Dark</option><option value="light">Light</option>
                <option value="cyber">Cyberpunk</option><option value="sakura">Sakura</option>
                <option value="gold">Gold</option><option value="midnight">OLED Black</option>
            </select>
            <div style="display:flex; justify-content:space-between; margin-top:20px; align-items:center;">
                <span data-i18n="show_scramble">顯示打亂公式</span>
                <input type="checkbox" id="sc-check" checked style="width:20px;" onchange="toggleScrambleDisplay()">
            </div>
        </div>
        <div id="st-timer" class="tab-pane">
            <label data-i18n="precision">小數點位數</label>
            <select id="dec-sel"><option value="2">2 位</option><option value="3" selected>3 位</option></select>
            <label data-i18n="inspection">WCA 觀察時限</label>
            <select id="ins-sel"><option value="0">關閉</option><option value="15">15 秒</option></select>
        </div>
        <button class="btn" style="background:none; color:var(--subtext)" onclick="closeAllModals()" data-i18n="close">關閉</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s", authDomain: "weifengtimer-17ea9.firebaseapp.com", projectId: "weifengtimer-17ea9", storageBucket: "weifengtimer-17ea9.firebasestorage.app", messagingSenderId: "852083740797", appId: "1:852083740797:web:4b2326142554cf8654a114" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); const db = getFirestore(app); const provider = new GoogleAuthProvider();

    let currentUser = null, allData = {}, currentEvent = "333", currentScramble = "";
    let timerState = "IDLE", startTime, timerInterval, holdTimeout, insInterval;

    // --- 多國語言設定 ---
    const i18n = {
        zh: { guest: "未登入", f_list: "好友列表", f_apply: "申請", send_req: "發送申請", history: "歷史成績", tab_acc: "帳號", tab_ui: "顯示", tab_timer: "計時", edit_name: "修改名字", edit_id: "修改 ID", save: "儲存更新", logout: "登出帳號", lang: "語言", theme: "主題顏色", show_scramble: "顯示打亂公式", precision: "小數點位數", inspection: "觀察時限", close: "關閉" },
        en: { guest: "Guest", f_list: "Friends", f_apply: "Apply", send_req: "Send Request", history: "History", tab_acc: "Account", tab_ui: "UI", tab_timer: "Timer", edit_name: "Nickname", edit_id: "Custom ID", save: "Save", logout: "Logout", lang: "Language", theme: "Theme", show_scramble: "Show Scramble", precision: "Decimals", inspection: "Inspection", close: "Close" },
        jp: { guest: "ゲスト", f_list: "フレンド", f_apply: "申請", send_req: "申請を送る", history: "履歴", tab_acc: "アカウント", tab_ui: "表示", tab_timer: "タイマー", edit_name: "名前変更", edit_id: "ID変更", save: "保存", logout: "ログアウト", lang: "言語", theme: "テーマ", show_scramble: "スクランブル表示", precision: "小数点", inspection: "インスペクション", close: "閉じる" }
    };

    window.changeLang = (lang) => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.innerText = i18n[lang][key];
        });
    };

    // --- 擴充打亂邏輯 ---
    function generateScramble() {
        const moves = {
            "333": { m: ["U","D","L","R","F","B"], l: 20 },
            "222": { m: ["U","R","F"], l: 9 },
            "444": { m: ["U","D","L","R","F","B","Uw","Dw","Lw","Rw","Fw","Bw"], l: 40 },
            "555": { m: ["U","D","L","R","F","B","Uw","Dw","Lw","Rw","Fw","Bw"], l: 60 },
            "666": { m: ["U","D","L","R","F","B","2U","2D","2L","2R","2F","2B","3U","3D"], l: 80 },
            "777": { m: ["U","D","L","R","F","B","2U","2D","2L","2R","2F","2B","3U","3D"], l: 100 },
            "pyram": { m: ["U","L","R","B"], l: 12, suffix: ["", "'"] },
            "skewb": { m: ["U","L","R","B"], l: 10, suffix: ["", "'"] },
            "mega": { m: ["R++","R--","D++","D--"], l: 70, special: "mega" }
        };

        let conf = moves[currentEvent] || moves["333"];
        let res = [], last = "";
        
        if(conf.special === "mega") {
            for(let i=1; i<=conf.l; i++) {
                res.push(conf.m[Math.floor(Math.random()*4)]);
                if(i % 10 === 0) res.push("U" + (Math.random()>0.5?"":"'"), "\n");
            }
        } else {
            for(let i=0; i<conf.l; i++) {
                let move = conf.m[Math.floor(Math.random()*conf.m.length)];
                while(move === last) move = conf.m[Math.floor(Math.random()*conf.m.length)];
                let suf = conf.suffix ? conf.suffix[Math.floor(Math.random()*conf.suffix.length)] : ["","'","2"][Math.floor(Math.random()*3)];
                res.push(move + suf); last = move;
            }
        }
        currentScramble = res.join(" ");
        toggleScrambleDisplay();
    }

    window.toggleScrambleDisplay = () => {
        const isShow = document.getElementById('sc-check').checked;
        document.getElementById('scramble').innerText = isShow ? currentScramble : "--- HIDDEN ---";
    }

    // --- 核心計時邏輯 ---
    const display = document.getElementById('timer-display');
    window.onkeydown = (e) => {
        if(e.code === 'Space'){
            e.preventDefault();
            if(timerState === "RUNNING") stopTimer();
            else if(timerState === "IDLE") {
                timerState = "READY"; display.style.color = "var(--ready)";
                holdTimeout = setTimeout(() => { timerState = "GO"; display.style.color = "var(--go)"; display.innerText = "0.000"; }, 500);
            } else if(timerState === "INSPECTION") startTimer();
        }
    };
    window.onkeyup = (e) => {
        if(e.code === 'Space'){
            clearTimeout(holdTimeout);
            if(timerState === "GO") {
                let ins = parseInt(document.getElementById('ins-sel').value);
                if(ins > 0) {
                    timerState = "INSPECTION"; let left = ins; display.style.color = "var(--ready)";
                    insInterval = setInterval(() => { left--; display.innerText = left; if(left<=0) startTimer(); }, 1000);
                } else startTimer();
            } else { timerState = "IDLE"; display.style.color = "var(--text)"; }
        }
    };

    function startTimer() { 
        clearInterval(insInterval); startTime = performance.now(); 
        const dec = document.getElementById('dec-sel').value;
        timerInterval = setInterval(() => { display.innerText = ((performance.now()-startTime)/1000).toFixed(dec); }, 10); 
        timerState = "RUNNING"; display.style.color = "var(--text)"; 
    }
    
    function stopTimer() { 
        clearInterval(timerInterval); timerState = "IDLE"; 
        const time = parseFloat(((performance.now()-startTime)/1000).toFixed(3)); 
        if(!allData[currentEvent]) allData[currentEvent] = [];
        allData[currentEvent].unshift({ time, id: Date.now(), scramble: currentScramble });
        renderSolves(); generateScramble(); 
        if(currentUser) updateDoc(doc(db, "users", currentUser.uid), { allData });
    }

    function renderSolves() {
        const solves = allData[currentEvent] || [];
        const dec = document.getElementById('dec-sel').value;
        document.getElementById('solve-list-ui').innerHTML = solves.map((s, idx) => `
            <div class="solve-item" onclick="alert('Scramble: \\n'+'${s.scramble || 'None'}')">
                <div style="display:flex; flex-direction:column;">
                    <span style="font-weight:bold; font-size:1.1rem;">${s.time.toFixed(dec)}s</span>
                    <small style="color:#666; font-size:0.7rem;">${new Date(s.id).toLocaleTimeString()}</small>
                </div>
                <span style="color:#ff4757; font-weight:bold; cursor:pointer;" onclick="deleteSolve(event, ${idx})">✕</span>
            </div>
        `).join('');
        const avg = (n) => solves.length < n ? "--" : (solves.slice(0,n).reduce((a,b)=>a+b.time,0)/n).toFixed(3);
        document.getElementById('ao5-val').innerText = avg(5);
        document.getElementById('ao12-val').innerText = avg(12);
    }

    // Firebase & UI Sync
    onAuthStateChanged(auth, async user => {
        if(user) {
            currentUser = user;
            document.getElementById('login-sec').style.display = 'none';
            document.getElementById('prof-sec').style.display = 'block';
            onSnapshot(doc(db, "users", user.uid), s => {
                if(s.exists()){
                    const d = s.data(); allData = d.allData || {};
                    document.getElementById('display-name-side').innerText = d.displayName;
                    document.getElementById('display-id-side').innerText = "#" + d.customID;
                    document.getElementById('name-in').value = d.displayName;
                    document.getElementById('id-in').value = d.customID;
                    renderSolves();
                }
            });
        }
    });

    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth).then(()=>location.reload());
    window.saveProfile = () => updateDoc(doc(db,"users",currentUser.uid), {displayName: document.getElementById('name-in').value, customID: document.getElementById('id-in').value}).then(()=>alert("Saved!"));
    window.deleteSolve = (e, idx) => { e.stopPropagation(); if(confirm("Delete?")) { allData[currentEvent].splice(idx,1); renderSolves(); updateDoc(doc(db,"users",currentUser.uid), {allData}); } };
    window.openModal = (id) => { document.getElementById('modal-overlay').classList.add('active'); document.getElementById(id).classList.add('active'); };
    window.closeAllModals = () => document.querySelectorAll('.modal, .overlay').forEach(el => el.classList.remove('active'));
    window.switchST = (e, id) => { document.querySelectorAll('.modal-tab, .tab-pane').forEach(el=>el.classList.remove('active')); e.target.classList.add('active'); document.getElementById(id).classList.add('active'); };
    window.switchF = (e, id) => { document.querySelectorAll('.f-pane, .f-tab-btn').forEach(el=>el.classList.remove('active')); e.target.classList.add('active'); document.getElementById('f-list').style.display = id==='f-list'?'block':'none'; document.getElementById('f-apply').style.display = id==='f-apply'?'block':'none'; };

    document.getElementById('event-selector').onchange = (e) => { currentEvent = e.target.value; generateScramble(); renderSolves(); };
    document.getElementById('hide-sidebar-btn').onclick = () => { document.getElementById('social-bar').classList.add('collapsed'); document.getElementById('show-sidebar-btn').style.display='flex'; };
    document.getElementById('show-sidebar-btn').onclick = () => { document.getElementById('social-bar').classList.remove('collapsed'); document.getElementById('show-sidebar-btn').style.display='none'; };

    generateScramble();
</script>
</body>
</html>
