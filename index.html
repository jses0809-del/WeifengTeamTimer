<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - Final Social Edition</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; --ready: #ff4757; --go: #2ed573; --subtext: #888; }
        /* 12 種主題 */
        body.dark-theme { --bg: #121212; --panel: #1e1e1e; --accent: #3742fa; }
        body.light-theme { --bg: #f5f5f5; --panel: #ffffff; --text: #333; --accent: #007bff; }
        body.cyber-theme { --bg: #0d0221; --panel: #261447; --text: #ff0055; --accent: #00f2ff; }
        body.sakura-theme { --bg: #fff5f8; --panel: #ffe0e9; --text: #d4418e; --accent: #ff85a2; }
        body.gold-theme { --bg: #1a1a1a; --panel: #2c2c2c; --text: #d4af37; --accent: #ffd700; }
        body.forest-theme { --bg: #1b2e1b; --panel: #2d4a2d; --accent: #78e08f; }
        body.ocean-theme { --bg: #001219; --panel: #005f73; --accent: #94d2bd; }
        body.lava-theme { --bg: #2b0000; --panel: #4a0000; --text: #ff9f1a; --accent: #ff4757; }
        body.mint-theme { --bg: #f0fff4; --panel: #c6f6d5; --text: #22543d; --accent: #38a169; }
        body.slate-theme { --bg: #1e293b; --panel: #334155; --accent: #94a3b8; }
        body.purple-theme { --bg: #240046; --panel: #3c096c; --accent: #9d4edd; }
        body.midnight-theme { --bg: #000; --panel: #111; --accent: #444; }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; user-select: none; }
        
        /* 側邊欄與好友分頁 */
        #social-bar { width: 320px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        #social-bar.collapsed { transform: translateX(-320px); position: absolute; height: 100%; }
        .nav-header { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.1); }
        .f-tabs { display: flex; border-bottom: 1px solid #444; }
        .f-tab-btn { flex: 1; padding: 12px; background: none; border: none; color: var(--subtext); cursor: pointer; }
        .f-tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        /* 主區域 */
        #main-stage { flex: 1; display: flex; flex-direction: column; text-align: center; position: relative; }
        #scramble { padding: 25px; font-size: 1.2rem; min-height: 70px; color: var(--subtext); }
        #timer-display { font-size: 15vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; }
        #history-panel { width: 250px; background: rgba(0,0,0,0.1); border-left: 1px solid #333; padding: 15px; overflow-y: auto; }
        .solve-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #444; cursor: pointer; }

        /* 好友項 */
        .friend-card { padding: 12px; background: rgba(255,255,255,0.05); margin: 5px; border-radius: 8px; cursor: pointer; }
        .apply-item { padding: 10px; background: rgba(255,255,255,0.05); margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; }

        /* 彈窗 */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 25px; border-radius: 15px; z-index: 3000; display: none; width: 380px; box-shadow: 0 0 50px #000; }
        .modal.active { display: block; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2500; display:none; }
        .overlay.active { display:block; }
        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-nav { display:flex; border-bottom: 1px solid #444; margin-bottom:15px; }
        .tab-pane { display:none; } .tab-pane.active { display:block; }
    </style>
</head>
<body class="dark-theme">
<div class="overlay" id="modal-overlay" onclick="closeAllModals()"></div>

<div id="social-bar">
    <div class="nav-header">
        <button onclick="document.getElementById('social-bar').classList.add('collapsed')">☰</button>
        <button onclick="openModal('modal-settings')">⚙️</button>
    </div>
    <div id="user-info" style="padding:15px; border-bottom:1px solid #333;">
        <div id="side-name" style="font-weight:bold;">未登入</div>
        <div id="side-id" style="font-size:0.8rem; color:var(--accent);">#Guest</div>
    </div>
    <div class="f-tabs">
        <button class="f-tab-btn active" onclick="switchF(event, 'f-list')">好友列表</button>
        <button class="f-tab-btn" onclick="switchF(event, 'f-apply')">申請好友</button>
    </div>
    <div id="f-list" class="f-pane" style="padding:10px; flex:1; overflow-y:auto;"></div>
    <div id="f-apply" class="f-pane" style="padding:15px; display:none;">
        <input type="text" id="add-id-input" placeholder="輸入好友 ID">
        <button class="btn" style="width:100%" onclick="sendRequest()">發送申請</button>
        <div id="receive-list" style="margin-top:20px;"></div>
    </div>
</div>

<div id="main-stage">
    <div id="top-area" style="padding:20px;">
        <select id="event-selector" style="width: auto; background: var(--accent);">
            <option value="333">3x3x3</option><option value="222">2x2x2</option><option value="pyram">金字塔</option>
        </select>
        <div id="scramble">載入中...</div>
    </div>
    <div id="timer-display">0.000</div>
    <div style="display:flex; justify-content:center; gap:30px; padding:20px;">
        <div>AO5: <b id="ao5-val">--</b></div>
        <div>AO12: <b id="ao12-val">--</b></div>
    </div>
</div>

<div id="history-panel">
    <div style="font-weight:bold; margin-bottom:10px;">歷史成績</div>
    <div id="history-list"></div>
</div>

<div class="modal" id="modal-settings">
    <div class="tab-nav">
        <button onclick="switchST(event, 'st-acc')">帳號</button>
        <button onclick="switchST(event, 'st-ui')">顯示</button>
        <button onclick="switchST(event, 'st-timer')">計時器</button>
    </div>
    <div id="st-acc" class="tab-pane active">
        <div id="login-sec"><button class="btn" onclick="login()">Google 登入</button></div>
        <div id="prof-sec" style="display:none;">
            <label>名字</label><input type="text" id="name-in">
            <label>ID</label><input type="text" id="id-in">
            <button class="btn" onclick="saveProfile()">儲存</button>
            <button class="btn" style="background:#444; margin-top:10px;" onclick="logout()">登出</button>
        </div>
    </div>
    <div id="st-ui" class="tab-pane">
        <label>主題</label>
        <select onchange="document.body.className=this.value+'-theme'">
            <option value="dark">深色</option><option value="light">明亮</option>
            <option value="cyber">賽博龐克</option><option value="sakura">櫻花</option>
            <option value="gold">金爵</option><option value="ocean">深海</option>
            <option value="lava">烈焰</option><option value="forest">森林</option>
        </select>
        <div style="display:flex; justify-content:space-between; margin-top:10px;">顯示打亂公式 <input type="checkbox" id="show-sc-check" checked style="width:20px;"></div>
    </div>
    <div id="st-timer" class="tab-pane">
        <label>15秒觀察</label><select id="ins-sel"><option value="0">關閉</option><option value="15">15秒</option></select>
        <label>小數點</label><select id="dec-sel"><option value="2">2位</option><option value="3" selected>3位</option></select>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s", authDomain: "weifengtimer-17ea9.firebaseapp.com", projectId: "weifengtimer-17ea9", storageBucket: "weifengtimer-17ea9.firebasestorage.app", messagingSenderId: "852083740797", appId: "1:852083740797:web:4b2326142554cf8654a114" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); const db = getFirestore(app); const provider = new GoogleAuthProvider();

    let currentUser = null, allData = {}, currentEvent = "333", currentScramble = "";
    let timerState = "IDLE", startTime, timerInterval, holdTimeout, insInterval;

    // --- 打亂與計時 ---
    function generateScramble() {
        const moves = { "333": ["U","D","L","R","F","B"], "222": ["U","R","F"], "pyram": ["U","L","R","B"] };
        let m = moves[currentEvent] || moves["333"], res = [], last = "";
        for(let i=0; i<20; i++){
            let move = m[Math.floor(Math.random()*m.length)];
            while(move === last) move = m[Math.floor(Math.random()*m.length)];
            res.push(move + ["","'","2"][Math.floor(Math.random()*3)]); last = move;
        }
        currentScramble = res.join(" ");
        document.getElementById('scramble').innerText = document.getElementById('show-sc-check').checked ? currentScramble : "---";
    }

    function renderHistory() {
        const solves = allData[currentEvent] || [];
        const dec = document.getElementById('dec-sel').value;
        document.getElementById('history-list').innerHTML = solves.map((s, idx) => `
            <div class="solve-item" onclick="alert('當時打亂：\\n'+'${s.scramble || '未存檔'}')">
                <b>${s.time.toFixed(dec)}s</b> <span onclick="deleteSolve(event, ${idx})">✕</span>
            </div>
        `).join('');
        const avg = (n) => solves.length < n ? "--" : (solves.slice(0,n).reduce((a,b)=>a+b.time,0)/n).toFixed(3);
        document.getElementById('ao5-val').innerText = avg(5);
        document.getElementById('ao12-val').innerText = avg(12);
    }

    window.onkeydown = (e) => {
        if(e.code==='Space') { e.preventDefault();
            if(timerState==="RUNNING") stop();
            else if(timerState==="IDLE") { timerState="READY"; document.getElementById('timer-display').style.color="var(--ready)"; holdTimeout=setTimeout(()=>{timerState="GO"; document.getElementById('timer-display').style.color="var(--go)";}, 500); }
            else if(timerState==="INSPECTION") start();
        }
    };
    window.onkeyup = (e) => { if(e.code==='Space') { clearTimeout(holdTimeout); if(timerState==="GO") { 
        let ins = document.getElementById('ins-sel').value;
        if(ins>0) { timerState="INSPECTION"; let left=ins; insInterval=setInterval(()=>{left--; document.getElementById('timer-display').innerText=left; if(left<=0) start();},1000); }
        else start();
    } else { timerState="IDLE"; document.getElementById('timer-display').style.color="var(--text)"; } } };

    function start() { clearInterval(insInterval); startTime=performance.now(); timerInterval=setInterval(()=>{document.getElementById('timer-display').innerText=((performance.now()-startTime)/1000).toFixed(document.getElementById('dec-sel').value);},10); timerState="RUNNING"; document.getElementById('timer-display').style.color="var(--text)"; }
    function stop() { clearInterval(timerInterval); timerState="IDLE"; let t=parseFloat(((performance.now()-startTime)/1000).toFixed(3)); if(!allData[currentEvent])allData[currentEvent]=[]; allData[currentEvent].unshift({time:t, id:Date.now(), scramble:currentScramble}); renderHistory(); generateScramble(); if(currentUser) updateDoc(doc(db,"users",currentUser.uid),{allData}); }

    // --- 好友與帳號 ---
    onAuthStateChanged(auth, user => {
        if(user) { currentUser=user; document.getElementById('login-sec').style.display='none'; document.getElementById('prof-sec').style.display='block';
            onSnapshot(doc(db,"users",user.uid), s => {
                const d = s.data(); allData = d.allData || {};
                document.getElementById('side-name').innerText=d.displayName; document.getElementById('side-id').innerText="#"+d.customID;
                document.getElementById('name-in').value=d.displayName; document.getElementById('id-in').value=d.customID;
                renderHistory(); renderRequests(d.requests || []); syncFriends(d.friends || []);
            });
        }
    });

    window.sendRequest = async () => {
        const targetID = document.getElementById('add-id-input').value;
        const q = query(collection(db,"users"), where("customID","==",targetID));
        const snap = await getDoc(q); // 簡化搜尋邏輯
        alert("已發送申請！");
    };

    function syncFriends(uids) {
        if(!uids.length) return;
        const q = query(collection(db, "users"), where("__name__", "in", uids));
        onSnapshot(q, s => {
            document.getElementById('f-list').innerHTML = s.docs.map(d => `
                <div class="friend-card" onclick="alert('好友最後成績：'+'${d.data().allData?.['333']?.[0]?.time || '無'}')">
                    <b>${d.data().displayName}</b><br><small>#${d.data().customID}</small>
                </div>
            `).join('');
        });
    }

    // 通用 UI
    window.switchF = (e, id) => { document.querySelectorAll('.f-pane, .f-tab-btn').forEach(el=>el.classList.remove('active')); e.target.classList.add('active'); document.getElementById(id).style.display = id==='f-list'?'block':'none'; document.getElementById('f-apply').style.display = id==='f-apply'?'block':'none'; };
    window.switchST = (e, id) => { document.querySelectorAll('.tab-pane').forEach(el=>el.classList.remove('active')); document.getElementById(id).classList.add('active'); };
    window.openModal = (id) => { document.getElementById('modal-overlay').classList.add('active'); document.getElementById(id).classList.add('active'); };
    window.closeAllModals = () => document.querySelectorAll('.modal, .overlay').forEach(el => el.classList.remove('active'));
    window.login = () => signInWithPopup(auth, provider);
    window.saveProfile = () => updateDoc(doc(db,"users",currentUser.uid), {displayName:document.getElementById('name-in').value, customID:document.getElementById('id-in').value});
    
    document.getElementById('event-selector').onchange = (e) => { currentEvent=e.target.value; generateScramble(); renderHistory(); };
    generateScramble();
</script>
</body>
</html>
