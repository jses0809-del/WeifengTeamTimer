<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>WeiFeng Timer - Professional</title>
<style>
:root {
--bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa;
--ready: #ff4757; --go: #2ed573; --subtext: #888;
}
body.dark-theme { --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; }
body.light-theme { --bg: #f5f5f5; --panel: #ffffff; --text: #333; --accent: #007bff; }
body.cyber-theme { --bg: #0d0221; --panel: #261447; --text: #ff0055; --accent: #00f2ff; }
body.sakura-theme { --bg: #fff5f8; --panel: #ffe0e9; --text: #d4418e; --accent: #ff85a2; }
body.gold-theme { --bg: #1a1a1a; --panel: #2c2c2c; --text: #d4af37; --accent: #ffd700; }

body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; user-select: none; }

#social-bar { width: 300px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; position: relative; }
#social-bar.collapsed { transform: translateX(-300px); position: absolute; height: 100%; }
.nav-header { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.1); }
.icon-btn { font-size: 20px; cursor: pointer; background: #333; border: none; color: white; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

#main-stage { flex: 1; display: flex; flex-direction: column; position: relative; text-align: center; }
#scramble { padding: 25px; font-size: 1.1rem; min-height: 70px; color: var(--subtext); line-height: 1.4; white-space: normal; word-break: break-word; }
#timer-display { font-size: 15vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; cursor: pointer; -webkit-tap-highlight-color: transparent; }

#history-panel { width: 250px; background: rgba(0,0,0,0.1); padding: 15px; border-left: 1px solid #333; overflow-y: auto; }
.solve-item { display: flex; flex-direction: column; padding: 10px; border-bottom: 1px solid #444; cursor: pointer; }
.solve-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.solve-ops { display: flex; gap: 5px; margin-top: 5px; }
.op-btn { font-size: 0.7rem; padding: 2px 5px; border-radius: 3px; border: 1px solid #555; background: none; color: var(--subtext); cursor: pointer; }
.op-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.del-btn { color: #ff4757; font-weight: bold; padding: 5px; }

.modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 25px; border-radius: 15px; z-index: 3000; display: none; width: 380px; box-shadow: 0 0 50px #000; }
.modal.active { display: block; }
.overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2500; display:none; }
.overlay.active { display:block; }

.tab-nav { display: flex; border-bottom: 1px solid #444; margin-bottom: 15px; }
.tab-link { flex:1; padding:10px; background:none; border:none; color:var(--subtext); cursor:pointer; font-weight:bold; font-size: 0.9rem; }
.tab-link.active { color:var(--accent); border-bottom: 2px solid var(--accent); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; margin: 8px 0; box-sizing: border-box; }
.btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }

.side-tab-nav { display: flex; border-bottom: 1px solid #333; margin-bottom: 10px; }
.side-tab-link { flex:1; padding:10px; background:none; border:none; color:var(--subtext); cursor:pointer; font-weight:bold; font-size: 0.85rem; transition: 0.2s; position: relative; }
.side-tab-link.active { color:var(--accent); border-bottom: 2px solid var(--accent); }

.blue-dot { width: 8px; height: 8px; background: #3742fa; border-radius: 50%; position: absolute; top: 8px; right: 8px; display: none; box-shadow: 0 0 5px #3742fa; }

.request-input-group { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
.small-label { font-size: 0.75rem; color: var(--subtext); margin-bottom: 4px; display: block; }
.req-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; margin-bottom: 5px; cursor: pointer; position: relative; }
.req-btns { display: flex; gap: 5px; }
.mini-btn { padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; border: none; color: white; }

#sidebar-chat-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--panel); display: none; flex-direction: column; z-index: 10; }
#sidebar-chat-view.active { display: flex; }
#chat-back-btn { padding: 15px; cursor: pointer; background: rgba(0,0,0,0.2); border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; }
#chat-msgs-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.side-msg { max-width: 85%; padding: 6px 10px; border-radius: 8px; font-size: 0.85rem; line-height: 1.3; }
.side-msg.mine { align-self: flex-end; background: var(--accent); color: #fff; }
.side-msg.theirs { align-self: flex-start; background: #333; color: #fff; }
.chat-input-row { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #333; }
</style>
</head>

<select id="theme-select" onchange="document.body.className=this.value+'-theme'">
<option value="dark">Dark</option>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs, arrayUnion, arrayRemove, addDoc, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s",
authDomain: "weifengtimer-17ea9.firebaseapp.com",
projectId: "weifengtimer-17ea9",
storageBucket: "weifengtimer-17ea9.firebasestorage.app",
messagingSenderId: "852083740797",
appId: "1:852083740797:web:4b2326142554cf8654a114"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const i18n = {
"zh-TW": {
not_logged_in: "未登入", history: "歷史成績",
tab_account: "帳號", tab_display: "顯示", tab_timer: "計時器",
login_google: "使用 Google 登入", label_name: "名字", label_id: "ID",
save_btn: "儲存修改", logout_btn: "登出帳號", label_theme: "主題",
label_lang: "語言", label_inspection: "15秒觀察", opt_off: "關閉",
opt_on: "開啟 (15s)", label_decimals: "小數點位數", del_confirm: "確定刪除？",
save_success: "存檔成功", id_limit: "三週內只能修改兩次 ID！", msg_scramble: "打亂公式：\n",
label_friends: "好友", label_requests: "申請", label_target_id: "對方ID", btn_confirm: "確認",
err_not_found: "找不到該用戶", err_self: "不能加自己為好友", msg_req_sent: "申請已發送", btn_accept: "接受", btn_delete: "刪除",
err_empty: "欄位不可為空"
},
"zh-CN": {
not_logged_in: "未登录", history: "历史成绩",
tab_account: "账号", tab_display: "显示", tab_timer: "计时器",
login_google: "使用 Google 登录", label_name: "名字", label_id: "ID",
save_btn: "保存修改", logout_btn: "登出账号", label_theme: "主题",
label_lang: "语言", label_inspection: "15秒观察", opt_off: "关闭",
opt_on: "开启 (15s)", label_decimals: "小数点位数", del_confirm: "确定删除？",
save_success: "保存成功", id_limit: "三周内只能修改两次 ID！", msg_scramble: "打乱公式：\n",
label_friends: "好友", label_requests: "申请", label_target_id: "對方ID", btn_confirm: "确认",
err_not_found: "找不到该用户", err_self: "不能加自己为好友", msg_req_sent: "申请已发送", btn_accept: "接受", btn_delete: "删除",
err_empty: "字段不能为空"
},
"en": {
not_logged_in: "Guest", history: "History",
tab_account: "Account", tab_display: "Display", tab_timer: "Timer",
login_google: "Login with Google", label_name: "Name", label_id: "ID",
save_btn: "Save Changes", logout_btn: "Logout", label_theme: "Theme",
label_lang: "Language", label_inspection: "Inspection", opt_off: "OFF",
opt_on: "ON (15s)", label_decimals: "Decimals", del_confirm: "Are you sure?",
save_success: "Saved!", id_limit: "ID can only be changed twice every 3 weeks!", msg_scramble: "Scramble:\n",
label_friends: "Friends", label_requests: "Requests", label_target_id: "Target ID", btn_confirm: "Confirm",
err_not_found: "User not found", err_self: "Cannot add yourself", msg_req_sent: "Request sent", btn_accept: "Accept", btn_delete: "Delete",
err_empty: "Fields cannot be empty"
},
"ja": {
not_logged_in: "未ログイン", history: "履歴",
tab_account: "アカウント", tab_display: "表示", tab_timer: "タイマー",
login_google: "Googleでログイン", label_name: "名前", label_id: "ID",
save_btn: "変更を保存", logout_btn: "ログアウト", label_theme: "テーマ",
label_lang: "言語", label_inspection: "インスペクション", opt_off: "オフ",
opt_on: "オン (15s)", label_decimals: "小数点以下", del_confirm: "削除しますか？",
save_success: "保存しました", id_limit: "IDの変更は3週間に2回までです！", msg_scramble: "スクランブル：\n",
label_friends: "フレンド", label_requests: "申請", label_target_id: "相手ID", btn_confirm: "確認",
err_not_found: "ユーザーが見つかりません", err_self: "自分は追加できません", msg_req_sent: "申請を送りました", btn_accept: "承認", btn_delete: "削除",
err_empty: "入力必須です"
}
};

let currentLang = localStorage.getItem('wf_lang') || 'zh-TW';

function updateLanguage() {
const langData = i18n[currentLang];
document.querySelectorAll('[data-i18n]').forEach(el => {
const key = el.getAttribute('data-i18n');
if (langData[key]) el.innerText = langData[key];
});
}

document.getElementById('lang-select').value = currentLang;
document.getElementById('lang-select').onchange = (e) => {
currentLang = e.target.value;
localStorage.setItem('wf_lang', currentLang);
location.reload(); 
};

// --- Settings ---
function loadSettings() {
    const inspection = localStorage.getItem('wf_inspection') || '0';
    const decimals = localStorage.getItem('wf_decimals') || '3';
    document.getElementById('inspection-select').value = inspection;
    document.getElementById('decimal-select').value = decimals;
}
document.getElementById('inspection-select').onchange = (e) => localStorage.setItem('wf_inspection', e.target.value);
document.getElementById('decimal-select').onchange = (e) => {
    localStorage.setItem('wf_decimals', e.target.value);
    renderSolves();
};
loadSettings();

// --- Timer Logic ---
let currentUser = null, allData = {}, currentEvent = "333", currentScramble = "";
let timerState = "IDLE", startTime, timerInterval, holdTimeout, insInterval;

const scramblers = {
"333": () => genMoves(["U","D","L","R","F","B"], 20),
"222": () => genMoves(["U","R","F"], 9),
"444": () => genMoves(["U","D","L","R","F","B","Uw","Rw","Fw"], 40),
"pyram": () => {
let s = genMoves(["U","L","R","B"], 10);
["u","l","r","b"].forEach(t => { if(Math.random()>0.5) s += ` ${t}${Math.random()>0.5?"'":""}`; });
return s;
},
"minx": () => {
let res = [];
for(let i=0; i<7; i++) {
let line = [];
for(let j=0; j<10; j++) {
let m = (j % 2 === 0) ? "R" : "D";
let s = (Math.random() > 0.5) ? "++" : "--";
line.push(m + s);
}
line.push(Math.random() > 0.5 ? "U" : "U'");
res.push(line.join(" "));
}
return res.join("<br>");
}
};

function genMoves(moves, len) {
let res = [], last = "";
for(let i=0; i<len; i++){
let m = moves[Math.floor(Math.random()*moves.length)];
while(m === last) m = moves[Math.floor(Math.random()*moves.length)];
res.push(m + ["","'","2"][Math.floor(Math.random()*3)]); last = m;
} return res.join(" ");
}

function generateScramble() {
currentScramble = (scramblers[currentEvent] || scramblers["333"])();
document.getElementById('scramble').innerHTML = currentScramble;
}

// --- UI Controls ---
window.switchTab = (e, paneId) => {
document.querySelectorAll('#modal-settings .tab-link, #modal-settings .tab-pane').forEach(el => el.classList.remove('active'));
e.target.classList.add('active');
document.getElementById(paneId).classList.add('active');
};

window.switchSideTab = (e, paneId) => {
document.querySelectorAll('.side-tab-link, #friend-section .tab-pane').forEach(el => el.classList.remove('active'));
e.target.classList.add('active');
document.getElementById(paneId).classList.add('active');
};

window.openModal = (id) => { document.getElementById('modal-overlay').classList.add('active'); document.getElementById(id).classList.add('active'); };
window.closeAllModals = () => document.querySelectorAll('.modal, .overlay').forEach(el => el.classList.remove('active'));

window.togglePenalty = (e, idx, penalty) => {
    e.stopPropagation();
    const solve = allData[currentEvent][idx];
    if (penalty === 'plus2') {
        solve.plus2 = !solve.plus2;
    } else if (penalty === 'dnf') {
        solve.dnf = !solve.dnf;
    }
    renderSolves();
    if(currentUser) updateDoc(doc(db, "users", currentUser.uid), { allData });
};

function renderSolves() {
const solves = allData[currentEvent] || [];
const dec = document.getElementById('decimal-select').value;
document.getElementById('solve-list-ui').innerHTML = solves.map((s, idx) => {
    let displayTime = s.dnf ? "DNF" : (s.plus2 ? (s.time + 2).toFixed(dec) + "+" : s.time.toFixed(dec));
    return `
    <div class="solve-item" onclick="alert('${i18n[currentLang].msg_scramble}'+'${(s.scramble || '').replace(/<br>/g, '\\n') || 'N/A'}')">
        <div class="solve-main">
            <b style="${s.dnf ? 'text-decoration:line-through; color:#888;' : ''}">${displayTime}</b>
            <span class="del-btn" onclick="deleteSolve(event, ${idx})">✕</span>
        </div>
        <div class="solve-ops">
            <button class="op-btn ${s.plus2?'active':''}" onclick="togglePenalty(event, ${idx}, 'plus2')">+2</button>
            <button class="op-btn ${s.dnf?'active':''}" onclick="togglePenalty(event, ${idx}, 'dnf')">DNF</button>
        </div>
    </div>
    `;
}).join('');

const avg = (n) => {
if(solves.length < n) return "--";
const lastN = solves.slice(0, n).map(s => {
    if (s.dnf) return Infinity;
    return s.plus2 ? s.time + 2 : s.time;
});
const dnfCount = lastN.filter(t => t === Infinity).length;
if (dnfCount > 1) return "DNF";
const sum = lastN.reduce((a,b) => a + b, 0);
if (sum === Infinity) return "DNF";
return (sum/n).toFixed(3);
};
document.getElementById('ao5-val').innerText = avg(5);
document.getElementById('ao12-val').innerText = avg(12);
}

window.deleteSolve = (e, idx) => {
e.stopPropagation();
if(confirm(i18n[currentLang].del_confirm)) {
allData[currentEvent].splice(idx, 1);
renderSolves();
if(currentUser) updateDoc(doc(db, "users", currentUser.uid), { allData });
}
};

const display = document.getElementById('timer-display');

function stopTimer() {
clearInterval(timerInterval); timerState = "IDLE";
const time = parseFloat(((performance.now() - startTime) / 1000).toFixed(3));
if(!allData[currentEvent]) allData[currentEvent] = [];
allData[currentEvent].unshift({ time, id: Date.now(), scramble: currentScramble, plus2: false, dnf: false });
renderSolves(); generateScramble();
if(currentUser) updateDoc(doc(db, "users", currentUser.uid), { allData });
display.style.color = "var(--text)";
}

function startTimer() {
clearInterval(insInterval);
startTime = performance.now();
timerInterval = setInterval(() => {
display.innerText = ((performance.now()-startTime)/1000).toFixed(document.getElementById('decimal-select').value);
}, 10);
timerState = "RUNNING"; display.style.color = "var(--text)";
}

function handleDown(e) {
    if(e.type === 'keydown' && e.code !== 'Space') return;
    if(e.target.closest('#social-bar') || e.target.closest('.modal') || e.target.closest('select') || e.target.closest('.solve-item')) return;
    if(e.type === 'keydown') e.preventDefault();
    if(timerState === "RUNNING") {
        stopTimer();
    } else if(timerState === "IDLE") {
        timerState = "READY"; display.style.color = "var(--ready)";
        holdTimeout = setTimeout(() => { 
            timerState = "GO"; display.style.color = "var(--go)"; 
            display.innerText = "0.000"; 
        }, 500);
    } else if(timerState === "INSPECTION") {
        startTimer();
    }
}

function handleUp(e) {
    if(e.type === 'keyup' && e.code !== 'Space') return;
    clearTimeout(holdTimeout);
    if(timerState === "GO") {
        const ins = document.getElementById('inspection-select').value;
        if(ins > 0) {
            timerState = "INSPECTION"; let left = ins; display.style.color = "var(--ready)";
            display.innerText = left;
            insInterval = setInterval(() => { left--; display.innerText = left; if(left<=0) startTimer(); }, 1000);
        } else {
            startTimer();
        }
    } else if(timerState === "READY") {
        timerState = "IDLE"; display.style.color = "var(--text)";
    }
}

window.onkeydown = handleDown;
window.onkeyup = handleUp;
document.addEventListener('touchstart', handleDown, {passive: false});
document.addEventListener('touchend', handleUp, {passive: false});

// --- Friends & Social 修復版本 ---
let chatUnsubscribe = null;
let currentChatUid = null;
let unreadMap = {};

// 修復：渲染申請列表
async function renderRequests(incoming) {
    const ui = document.getElementById('requests-list-ui');
    document.getElementById('req-dot').style.display = (incoming && incoming.length > 0) ? 'block' : 'none';

    if(!incoming || incoming.length === 0) { 
        ui.innerText = "無申請項目"; 
        return; 
    }
    
    ui.innerHTML = "載入中..."; 
    let html = "";
    for(let uid of incoming) {
        try {
            const snap = await getDoc(doc(db, "users", uid));
            if(snap.exists()) {
                const d = snap.data();
                html += `
                <div class="req-item">
                    <span>${d.displayName} (#${d.customID})</span>
                    <div class="req-btns">
                        <button class="mini-btn" style="background:var(--go)" onclick="handleFriend('${uid}', 'accept')">${i18n[currentLang].btn_accept}</button>
                        <button class="mini-btn" style="background:var(--ready)" onclick="handleFriend('${uid}', 'reject')">${i18n[currentLang].btn_delete}</button>
                    </div>
                </div>`;
            }
        } catch(e) { console.error("Request loading error", e); }
    }
    ui.innerHTML = html || "無申請項目";
}

// 修復：渲染好友列表與未讀狀態
async function renderFriends(friends) {
    const ui = document.getElementById('friends-list-ui');
    if(!friends || friends.length === 0) { 
        ui.innerText = "尚無好友"; 
        document.getElementById('msg-dot-global').style.display = 'none';
        return; 
    }

    ui.innerHTML = "載入好友...";
    let friendsData = [];
    
    // 獲取所有好友資料
    for(let uid of friends) {
        try {
            const snap = await getDoc(doc(db, "users", uid));
            if(snap.exists()) {
                friendsData.push({ uid, ...snap.data() });
            }
        } catch(e) { console.error("Friend loading error", e); }
    }

    ui.innerHTML = "";
    friendsData.forEach(f => {
        const div = document.createElement('div');
        div.className = "req-item";
        div.id = `friend-item-${f.uid}`;
        div.onclick = () => openSidebarChat(f.uid, f.displayName);
        
        // 即時監聽該好友的未讀訊息
        const chatId = [currentUser.uid, f.uid].sort().join("_");
        const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "desc"), where("senderId", "==", f.uid), limit(1));
        
        onSnapshot(q, (snap) => {
            if(!snap.empty){
                const latest = snap.docs[0].data();
                const lastViewed = localStorage.getItem(`viewed_${chatId}`) || 0;
                if(latest.timestamp && latest.timestamp.toMillis() > lastViewed && currentChatUid !== f.uid) {
                    unreadMap[f.uid] = true;
                } else {
                    unreadMap[f.uid] = false;
                }
            }
            updateFriendUI(f.uid, f.displayName);
        });

        div.innerHTML = `<span>${f.displayName}</span><span class="blue-dot"></span>`;
        ui.appendChild(div);
    });
}

function updateFriendUI(uid, name) {
    const item = document.getElementById(`friend-item-${uid}`);
    if(item) {
        const dot = item.querySelector('.blue-dot');
        dot.style.display = unreadMap[uid] ? 'block' : 'none';
    }
    const hasAnyUnread = Object.values(unreadMap).some(v => v === true);
    document.getElementById('msg-dot-global').style.display = hasAnyUnread ? 'block' : 'none';
}

window.handleFriend = async (targetUid, action) => {
    const myRef = doc(db, "users", currentUser.uid);
    const targetRef = doc(db, "users", targetUid);
    if(action === 'accept') {
        await updateDoc(myRef, { friends: arrayUnion(targetUid), incomingRequests: arrayRemove(targetUid) });
        await updateDoc(targetRef, { friends: arrayUnion(currentUser.uid) });
    } else {
        await updateDoc(myRef, { incomingRequests: arrayRemove(targetUid) });
    }
};

document.getElementById('send-request-btn').onclick = async () => {
    if(!currentUser) return;
    const targetID = document.getElementById('target-friend-id').value.trim();
    if(!targetID) return;
    const q = query(collection(db, "users"), where("customID", "==", targetID));
    const snap = await getDocs(q);
    if(snap.empty) return alert(i18n[currentLang].err_not_found);
    const targetDoc = snap.docs[0];
    if(targetDoc.id === currentUser.uid) return alert(i18n[currentLang].err_self);
    await updateDoc(doc(db, "users", targetDoc.id), { incomingRequests: arrayUnion(currentUser.uid) });
    alert(i18n[currentLang].msg_req_sent);
    document.getElementById('target-friend-id').value = "";
};

async function openSidebarChat(uid, name) {
    currentChatUid = uid;
    unreadMap[uid] = false;
    const chatId = [currentUser.uid, uid].sort().join("_");
    localStorage.setItem(`viewed_${chatId}`, Date.now());
    updateFriendUI(uid, name);

    document.getElementById('chat-title-name').innerText = name;
    document.getElementById('sidebar-friends-view').style.display = 'none';
    document.getElementById('sidebar-chat-view').classList.add('active');

    const chatRef = collection(db, "chats", chatId, "messages");
    const q = query(chatRef, orderBy("timestamp", "asc"));
    if(chatUnsubscribe) chatUnsubscribe();
    chatUnsubscribe = onSnapshot(q, (snapshot) => {
        const container = document.getElementById('chat-msgs-container');
        container.innerHTML = "";
        snapshot.forEach(d => {
            const msg = d.data();
            const div = document.createElement('div');
            div.className = `side-msg ${msg.senderId === currentUser.uid ? 'mine' : 'theirs'}`;
            div.innerText = msg.text;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
        localStorage.setItem(`viewed_${chatId}`, Date.now());
    });
}

window.closeSidebarChat = () => {
    if(chatUnsubscribe) chatUnsubscribe();
    currentChatUid = null;
    document.getElementById('sidebar-chat-view').classList.remove('active');
    document.getElementById('sidebar-friends-view').style.display = 'flex';
};

document.getElementById('side-chat-send').onclick = sendChatMessage;
document.getElementById('side-chat-input').onkeydown = (e) => { if(e.key==='Enter') sendChatMessage(); };

async function sendChatMessage() {
    const input = document.getElementById('side-chat-input');
    const text = input.value.trim();
    if(!text || !currentChatUid) return;
    const chatId = [currentUser.uid, currentChatUid].sort().join("_");
    await addDoc(collection(db, "chats", chatId, "messages"), {
        senderId: currentUser.uid,
        text: text,
        timestamp: serverTimestamp()
    });
    input.value = "";
}

// --- Firebase Auth ---
onAuthStateChanged(auth, async user => {
    if(user) {
        currentUser = user;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('profile-section').style.display = 'block';
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        if(!snap.exists()){
            await setDoc(userRef, { displayName: user.displayName || "Cuber", customID: user.uid.slice(0, 6), allData: {}, idUpdates: [], friends: [], incomingRequests: [] });
        }
        onSnapshot(userRef, s => {
            if(s.exists()){
                const d = s.data();
                allData = d.allData || {};
                document.getElementById('display-name-sidebar').innerText = d.displayName;
                document.getElementById('display-id-sidebar').innerText = "#" + (d.customID || "");
                document.getElementById('name-input').value = d.displayName;
                document.getElementById('id-input').value = d.customID;
                renderSolves();
                renderRequests(d.incomingRequests || []);
                renderFriends(d.friends || []);
            }
        });
    } else {
        currentUser = null;
        allData = {};
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('profile-section').style.display = 'none';
        document.getElementById('display-name-sidebar').innerText = i18n[currentLang].not_logged_in;
        document.getElementById('display-id-sidebar').innerText = "#Guest";
        document.getElementById('solve-list-ui').innerHTML = "";
        document.getElementById('requests-list-ui').innerText = "請先登入";
        document.getElementById('friends-list-ui').innerText = "請先登入";
        renderSolves();
    }
});

document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
document.getElementById('logout-btn').onclick = () => signOut(auth).then(()=>location.reload());

document.getElementById('save-profile').onclick = async () => {
    if(!currentUser) return;
    const newName = document.getElementById('name-input').value.trim();
    const newID = document.getElementById('id-input').value.trim();
    if(!newName || !newID) return alert(i18n[currentLang].err_empty);

    const userRef = doc(db, "users", currentUser.uid);
    const snap = await getDoc(userRef);
    const data = snap.data();
    let updates = data.idUpdates || [];
    const now = Date.now();
    updates = updates.filter(t => now - t < 21 * 24 * 60 * 60 * 1000);

    if(data.customID !== newID){
        if(updates.length >= 2) return alert(i18n[currentLang].id_limit);
        updates.push(now);
    }
    await updateDoc(userRef, { displayName: newName, customID: newID, idUpdates: updates });
    alert(i18n[currentLang].save_success);
};

document.getElementById('event-selector').onchange = (e) => { currentEvent = e.target.value; generateScramble(); renderSolves(); };
document.getElementById('hide-sidebar-btn').onclick = () => { document.getElementById('social-bar').classList.add('collapsed'); document.getElementById('show-sidebar-btn').style.display='flex'; };
document.getElementById('show-sidebar-btn').onclick = () => { document.getElementById('social-bar').classList.remove('collapsed'); document.getElementById('show-sidebar-btn').style.display='none'; };

updateLanguage();
generateScramble();
</script>
