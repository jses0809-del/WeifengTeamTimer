<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeiFeng Timer - Custom Pro</title>
    <style>
        :root { 
            --bg: #121212; 
            --panel: #1e1e1e; 
            --text: #ffffff; 
            --accent: #3742fa; 
            --ready: #ff4757; 
            --go: #2ed573; 
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        
        #header { width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--panel); z-index: 100; box-sizing: border-box; }
        .user-controls { display: flex; gap: 10px; align-items: center; }
        
        /* 設定面板樣式 */
        #settings-panel {
            position: fixed; left: -300px; top: 0; width: 280px; height: 100%; 
            background: var(--panel); transition: 0.3s; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); z-index: 200;
        }
        #settings-panel.open { left: 0; }
        .setting-item { margin-bottom: 20px; }
        .setting-item label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }

        #scramble { padding: 20px; font-size: 1.2rem; color: #aaa; text-align: center; width: 80%; max-width: 800px; min-height: 80px; word-wrap: break-word; }
        #timer-display { font-size: 15vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; }
        
        #sidebar { position: fixed; right: 20px; top: 90px; width: 200px; background: rgba(30,30,30,0.8); padding: 15px; border-radius: 10px; max-height: 60vh; overflow-y: auto; z-index: 50; }
        
        button, select, input { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        input[type="text"] { width: 100%; box-sizing: border-box; cursor: text; }
        
        .solve-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<div id="settings-panel">
    <h2>設定</h2>
    <div class="setting-item">
        <label>顯示名稱 (ID)</label>
        <input type="text" id="id-input" placeholder="輸入你的 ID...">
        <button id="save-id" style="margin-top:5px; width:100%">儲存 ID</button>
    </div>
    <div class="setting-item">
        <label>主體顏色 (Accent)</label>
        <input type="color" id="color-picker" value="#3742fa" style="width:100%; height:40px">
    </div>
    <button id="close-settings" style="width:100%; background: #444;">關閉</button>
</div>

<div id="header">
    <div style="display:flex; gap:10px">
        <button id="open-settings">⚙️ 設定</button>
        <select id="event-select">
            <option value="333">3x3x3</option>
            <option value="222">2x2x2</option>
            <option value="444">4x4x4</option>
            <option value="555">5x5x5</option>
            <option value="pyram">Pyraminx</option>
            <option value="minx">Megaminx</option>
        </select>
    </div>
    <div class="user-controls">
        <span id="user-display"></span>
        <button id="login-btn">Google 登入</button>
        <button id="logout-btn" style="display:none">登出</button>
    </div>
</div>

<div id="scramble">載入中...</div>
<div id="timer-display">0.000</div>

<div id="sidebar">
    <div style="display:flex; justify-content: space-around; font-weight: bold; margin-bottom:10px">
        <span>AO5: <b id="ao5">--</b></span>
        <span>AO12: <b id="ao12">--</b></span>
    </div>
    <div id="solve-list"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s",
        authDomain: "weifengtimer-17ea9.firebaseapp.com",
        projectId: "weifengtimer-17ea9",
        storageBucket: "weifengtimer-17ea9.firebasestorage.app",
        messagingSenderId: "852083740797",
        appId: "1:852083740797:web:4b2326142554cf8654a114",
        measurementId: "G-REE1EVZ4VJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let solves = [], timerState = "IDLE", startTime, timerInterval, holdTimeout, currentUser = null;

    // --- 設定功能邏輯 ---
    const settingsPanel = document.getElementById('settings-panel');
    document.getElementById('open-settings').onclick = () => settingsPanel.classList.add('open');
    document.getElementById('close-settings').onclick = () => settingsPanel.classList.remove('open');

    // 顏色設定
    const colorPicker = document.getElementById('color-picker');
    const savedColor = localStorage.getItem('wf-accent') || '#3742fa';
    document.documentElement.style.setProperty('--accent', savedColor);
    colorPicker.value = savedColor;

    colorPicker.oninput = (e) => {
        const color = e.target.value;
        document.documentElement.style.setProperty('--accent', color);
        localStorage.setItem('wf-accent', color);
    };

    // ID 修改
    document.getElementById('save-id').onclick = async () => {
        const newID = document.getElementById('id-input').value;
        if (currentUser && newID) {
            await updateDoc(doc(db, "users", currentUser.uid), { customID: newID });
            document.getElementById('user-display').innerText = newID;
            alert("ID 已更新！");
        } else {
            alert("請先登入帳號");
        }
    };

    // --- 帳號監聽 ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('login-btn').style.display = "none";
            document.getElementById('logout-btn').style.display = "inline-block";
            
            const data = await getDoc(doc(db, "users", user.uid));
            if (data.exists()) {
                solves = data.data().solves || [];
                const customID = data.data().customID || user.displayName;
                document.getElementById('user-display').innerText = customID;
                document.getElementById('id-input').value = customID;
            }
            updateUI();
        } else {
            currentUser = null;
            document.getElementById('login-btn').style.display = "inline-block";
            document.getElementById('logout-btn').style.display = "none";
            document.getElementById('user-display').innerText = "";
            solves = [];
            updateUI();
        }
    });

    // --- 其餘計時核心邏輯 (Space 攔截, 打亂等) ---
    // [此處保持與上一版相同的 handleDown, handleUp, stopTimer, generateScramble 邏輯]
    // ... 
    
    // (為了節省空間，下方重複邏輯簡化，請確保與上一版一致)
    window.addEventListener('keydown', (e) => { if(e.code==='Space'){e.preventDefault(); handleDown();} });
    window.addEventListener('keyup', (e) => { if(e.code==='Space'){e.preventDefault(); handleUp();} });

    function handleDown() {
        if(timerState==="RUNNING") stopTimer();
        else if(timerState==="IDLE"){
            timerState="READY"; 
            document.getElementById('timer-display').style.color="var(--ready)";
            holdTimeout=setTimeout(()=>{
                timerState="GO"; 
                document.getElementById('timer-display').style.color="var(--go)";
                document.getElementById('timer-display').innerText="0.000";
            },500);
        }
    }
    function handleUp(){
        clearTimeout(holdTimeout);
        if(timerState==="GO"){
            startTime=performance.now();
            timerInterval=setInterval(()=>{
                document.getElementById('timer-display').innerText=((performance.now()-startTime)/1000).toFixed(3);
            },10);
            timerState="RUNNING";
            document.getElementById('timer-display').style.color="var(--text)";
        } else {
            timerState="IDLE"; document.getElementById('timer-display').style.color="var(--text)";
        }
    }
    function stopTimer(){
        clearInterval(timerInterval); timerState="IDLE";
        const finalTime=parseFloat(((performance.now()-startTime)/1000).toFixed(3));
        solves.unshift({time: finalTime, id: Date.now()});
        updateUI(); syncToCloud(); generateScramble();
    }
    function updateUI(){
        document.getElementById('ao5').innerText = calculateAverage(5);
        document.getElementById('ao12').innerText = calculateAverage(12);
        document.getElementById('solve-list').innerHTML = solves.map(s=>`<div class="solve-item"><span>${s.time.toFixed(3)}</span><button onclick="window.delSolve(${s.id})">X</button></div>`).join('');
    }
    function calculateAverage(n){ if(solves.length<n)return "--"; let r=solves.slice(0,n).map(s=>s.time); r.sort((a,b)=>a-b); r.pop(); r.shift(); return (r.reduce((a,b)=>a+b,0)/(n-2)).toFixed(3); }
    window.delSolve=(id)=>{solves=solves.filter(s=>s.id!==id); updateUI(); syncToCloud();};
    async function syncToCloud(){if(currentUser)await setDoc(doc(db,"users",currentUser.uid),{solves},{merge:true});}
    function generateScramble(){ 
        const event=document.getElementById('event-select').value;
        let m=["U","D","L","R","F","B"], s=[]; 
        for(let i=0;i<20;i++)s.push(m[Math.floor(Math.random()*6)]+["","'","2"][Math.floor(Math.random()*3)]);
        document.getElementById('scramble').innerText=s.join(" ");
    }
    document.getElementById('login-btn').onclick=()=>signInWithPopup(auth,provider);
    document.getElementById('logout-btn').onclick=()=>signOut(auth);
    document.getElementById('event-select').onchange=generateScramble;
    generateScramble();
</script>
</body>
</html>
