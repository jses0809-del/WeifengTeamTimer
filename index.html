<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>WeiFeng Timer</title>

<style>
:root{
--bg:#121212;--panel:#1e1e1e;--text:#fff;--accent:#3742fa;
--ready:#ff4757;--go:#2ed573;--subtext:#888;
}
body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--text);font-family:Segoe UI}
#social-bar{width:300px;background:var(--panel);display:flex;flex-direction:column}
.req-item{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:6px;background:rgba(255,255,255,.05);margin-bottom:6px}
.friend-name{cursor:pointer}
.friend-menu{position:relative}
.menu-btn{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer}
.menu-list{position:absolute;right:0;top:22px;background:#222;border-radius:6px;display:none;flex-direction:column;z-index:99}
.menu-list button{background:none;border:none;color:#fff;padding:6px 10px;text-align:left;cursor:pointer}
.menu-list button:hover{background:#333}
.menu-list.show{display:flex}

#sidebar-chat-view{display:none;flex-direction:column;height:100%}
#chat-msgs-container{flex:1;overflow-y:auto;padding:10px}
.side-msg{max-width:75%;padding:6px 10px;border-radius:8px;margin-bottom:6px}
.mine{align-self:flex-end;background:var(--accent)}
.theirs{align-self:flex-start;background:#333}
.chat-input-row{display:flex;padding:8px;border-top:1px solid #333}
.chat-input-row input{flex:1;padding:8px;border-radius:6px;border:none}
.chat-input-row button{margin-left:6px}
</style>
</head>

<body>

<div id="social-bar">
<div id="sidebar-friends-view">
<div style="padding:10px;font-weight:bold">好友</div>
<div id="friends-list-ui"></div>
</div>

<div id="sidebar-chat-view">
<div style="padding:10px;border-bottom:1px solid #333;cursor:pointer" onclick="closeChat()">⬅ 返回</div>
<div id="chat-msgs-container"></div>
<div class="chat-input-row">
<input id="chat-input" placeholder="輸入訊息…">
<button onclick="sendMsg()">送出</button>
</div>
</div>
</div>

<div style="flex:1;display:flex;align-items:center;justify-content:center">
<h1>Timer 主畫面（略）</h1>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getFirestore,doc,setDoc,getDoc,updateDoc,collection,addDoc,onSnapshot,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app=initializeApp({
apiKey:"AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s",
authDomain:"weifengtimer-17ea9.firebaseapp.com",
projectId:"weifengtimer-17ea9"
});
const db=getFirestore(app);
const auth=getAuth(app);

let me=null,currentChat=null,unsub=null;

onAuthStateChanged(auth,async u=>{
if(!u)return;
me=u;
const ref=doc(db,"users",u.uid);
if(!(await getDoc(ref)).exists()){
await setDoc(ref,{friends:[],friendsPinned:[],blockedUsers:[]});
}
onSnapshot(ref,s=>renderFriends(s.data()));
});

async function renderFriends(d){
const ui=document.getElementById("friends-list-ui");
ui.innerHTML="";
const list=[...(d.friendsPinned||[]),...(d.friends||[])];
for(const uid of new Set(list)){
if((d.blockedUsers||[]).includes(uid))continue;
const u=await getDoc(doc(db,"users",uid));
const div=document.createElement("div");
div.className="req-item";
div.innerHTML=`
<span class="friend-name">${u.data().displayName}</span>
<div class="friend-menu">
<button class="menu-btn">⋮</button>
<div class="menu-list">
<button onclick="pinFriend('${uid}')">釘選</button>
<button onclick="removeFriend('${uid}')">刪除</button>
<button onclick="blockFriend('${uid}')">封鎖</button>
</div>
</div>`;
div.querySelector(".friend-name").onclick=()=>openChat(uid,u.data().displayName);
div.querySelector(".menu-btn").onclick=e=>{
e.stopPropagation();
div.querySelector(".menu-list").classList.toggle("show");
};
ui.appendChild(div);
}
}

async function pinFriend(uid){
await updateDoc(doc(db,"users",me.uid),{friendsPinned:[uid]});
}

async function removeFriend(uid){
await updateDoc(doc(db,"users",me.uid),{friends:[]});
}

async function blockFriend(uid){
await updateDoc(doc(db,"users",me.uid),{blockedUsers:[uid]});
}

function openChat(uid,name){
currentChat=uid;
document.getElementById("sidebar-friends-view").style.display="none";
document.getElementById("sidebar-chat-view").style.display="flex";
const cid=[me.uid,uid].sort().join("_");
if(unsub)unsub();
unsub=onSnapshot(collection(db,"chats",cid,"messages"),s=>{
const box=document.getElementById("chat-msgs-container");
box.innerHTML="";
s.forEach(d=>{
const m=d.data();
const div=document.createElement("div");
div.className="side-msg "+(m.sender===me.uid?"mine":"theirs");
div.textContent=m.text;
if(m.sender===me.uid){
div.onclick=()=>{
const t=prompt("編輯訊息",m.text);
if(t!==null)updateDoc(doc(db,"chats",cid,"messages",d.id),{text:t});
};
div.oncontextmenu=e=>{
e.preventDefault();
if(confirm("刪除？"))deleteDoc(doc(db,"chats",cid,"messages",d.id));
};
}
box.appendChild(div);
});
box.scrollTop=box.scrollHeight;
});
}

function closeChat(){
if(unsub)unsub();
document.getElementById("sidebar-chat-view").style.display="none";
document.getElementById("sidebar-friends-view").style.display="block";
}

async function sendMsg(){
const t=document.getElementById("chat-input").value.trim();
if(!t)return;
const cid=[me.uid,currentChat].sort().join("_");
await addDoc(collection(db,"chats",cid,"messages"),{
sender:me.uid,text:t,ts:serverTimestamp()
});
document.getElementById("chat-input").value="";
}
</script>
</body>
</html>
