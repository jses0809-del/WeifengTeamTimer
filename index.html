<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - 社群聯網版</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* 左側：好友與訊息欄 */
        #social-sidebar { width: 280px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .social-section { padding: 15px; border-bottom: 1px solid #333; flex: 1; overflow-y: auto; }
        .friend-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #2a2a2a; margin-bottom: 5px; border-radius: 5px; font-size: 0.9rem; }
        .friend-solve { font-size: 0.75rem; color: #2ed573; }

        /* 中間：計時主區 */
        #main-timer { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
        #timer-display { font-size: 15vw; font-weight: bold; margin: auto; }
        #scramble { padding: 30px; text-align: center; color: #888; font-size: 1.2rem; }

        /* 右側：個人成績 */
        #history-sidebar { width: 200px; background: rgba(0,0,0,0.2); padding: 15px; }

        input, button { background: #333; color: white; border: 1px solid #444; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button { background: var(--accent); border: none; cursor: pointer; font-weight: bold; }
        .chat-box { height: 150px; background: #121212; margin-top: 10px; padding: 5px; font-size: 0.8rem; overflow-y: auto; }
    </style>
</head>
<body>

<div id="social-sidebar">
    <div class="social-section">
        <h4>🔍 找好友</h4>
        <input type="text" id="search-id" placeholder="輸入好友 ID...">
        <button id="add-friend-btn" style="margin-top:5px">加好友</button>
    </div>
    <div class="social-section">
        <h4>👥 好友成績動態</h4>
        <div id="friends-list">載入中...</div>
    </div>
    <div class="social-section" style="flex: 0 0 250px;">
        <h4>💬 聊天室 (群體)</h4>
        <div id="chat-content" class="chat-box"></div>
        <input type="text" id="chat-input" placeholder="說點什麼..." style="margin-top:5px">
    </div>
</div>

<div id="main-timer">
    <div id="scramble">...</div>
    <div id="timer-display">0.000</div>
    <div style="padding: 20px;">
        <span id="my-info">未登入</span>
        <button id="login-btn" style="width: auto;">Google 登入</button>
    </div>
</div>

<div id="history-sidebar">
    <h4>我的成績</h4>
    <div id="my-solves"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { /* 這裡貼上你的 Firebase Config */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let myData = {};

    // --- 1. 核心計時邏輯 ---
    // (此處保留之前的 handleDown/Up 邏輯，但在 stopTimer 時多做一個動作：更新好友看到的成績)
    async function broadcastSolve(time) {
        if (!currentUser) return;
        const userRef = doc(db, "users", currentUser.uid);
        await updateDoc(userRef, { 
            lastSolve: time,
            solves: arrayUnion({ time, id: Date.now() })
        });
    }

    // --- 2. 好友與社交功能 ---
    document.getElementById('add-friend-btn').onclick = async () => {
        const targetID = document.getElementById('search-id').value.trim();
        const q = query(collection(db, "users"), where("customID", "==", targetID));
        const snap = await getDocs(q);
        
        if (snap.empty) return alert("找不到此 ID");
        
        const targetUID = snap.docs[0].id;
        await updateDoc(doc(db, "users", currentUser.uid), {
            friends: arrayUnion(targetUID)
        });
        alert("已加入好友！");
    };

    // 監聽好友動態
    function listenToFriends(friendUIDs) {
        if (!friendUIDs || friendUIDs.length === 0) return;
        const q = query(collection(db, "users"), where("__name__", "in", friendUIDs));
        onSnapshot(q, (snap) => {
            const list = document.getElementById('friends-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                list.innerHTML += `
                    <div class="friend-item">
                        <span>${data.displayName}</span>
                        <span class="friend-solve">${data.lastSolve ? data.lastSolve.toFixed(3) : '--'}</span>
                    </div>
                `;
            });
        });
    }

    // --- 3. 聊天室邏輯 ---
    document.getElementById('chat-input').onkeydown = async (e) => {
        if (e.key === 'Enter' && currentUser) {
            const msg = e.target.value;
            await setDoc(doc(collection(db, "messages")), {
                text: `${myData.customID}: ${msg}`,
                time: Date.now()
            });
            e.target.value = "";
        }
    };

    onSnapshot(query(collection(db, "messages")), (snap) => {
        const chat = document.getElementById('chat-content');
        chat.innerHTML = snap.docs.sort((a,b) => a.data().time - b.data().time)
                         .map(d => `<div>${d.data().text}</div>`).join('');
        chat.scrollTop = chat.scrollHeight;
    });

    // --- 4. 登入與初始化 ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                // 初次登入初始化
                const newID = "user" + Math.floor(Math.random()*1000);
                await setDoc(userRef, { displayName: user.displayName, customID: newID, friends: [], lastSolve: 0 });
            }
            myData = (await getDoc(userRef)).data();
            document.getElementById('my-info').innerText = `${myData.displayName} (#${myData.customID})`;
            listenToFriends(myData.friends);
        }
    });

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    
    // (其餘 Space 鍵計時邏輯請參考前一版並呼叫 broadcastSolve)
</script>
</body>
</html>
