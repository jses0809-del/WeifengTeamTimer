<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeiFeng Timer - Pro Edition</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --text: #fff; --ready: #ff4757; --go: #2ed573; --accent: #3742fa; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        
        /* 頂部控制列 */
        #header { width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--panel); box-sizing: border-box; z-index: 100; }
        .user-controls { display: flex; gap: 10px; align-items: center; }
        
        /* 打亂公式區域：解決遮擋問題 */
        #scramble { 
            padding: 20px 40px; 
            font-size: 1.2rem; 
            color: #aaa; 
            text-align: center; 
            width: 100%;
            max-width: 800px;
            min-height: 100px; 
            word-wrap: break-word; /* 自動換行 */
            overflow-y: auto;      /* 太長可捲動 */
            box-sizing: border-box;
        }

        /* 計時器主體 */
        #timer-display { font-size: 15vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; z-index: 10; }

        /* 統計側欄 */
        #sidebar { 
            position: fixed; right: 20px; top: 90px; width: 220px; 
            background: rgba(30, 30, 30, 0.9); padding: 15px; border-radius: 10px; 
            max-height: 70vh; display: flex; flex-direction: column; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 50;
        }

        button, select { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        #logout-btn { background: #444; display: none; } /* 預設隱藏 */
        #login-btn { background: var(--accent); }

        .solve-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 0.9rem; }
        .dnf { color: var(--ready); text-decoration: line-through; }
        .stats-summary { display: flex; justify-content: space-around; margin-bottom: 15px; font-weight: bold; border-bottom: 2px solid #333; padding-bottom: 10px; }
        #solve-list { overflow-y: auto; flex-grow: 1; }
    </style>
</head>
<body>

<div id="header">
    <select id="event-select">
        <option value="333">3x3x3</option>
        <option value="222">2x2x2</option>
        <option value="444">4x4x4</option>
        <option value="555">5x5x5</option>
        <option value="pyram">Pyraminx</option>
        <option value="minx">Megaminx</option>
    </select>
    <div class="user-controls">
        <span id="user-display"></span>
        <button id="login-btn">Google 登入</button>
        <button id="logout-btn">登出</button>
    </div>
</div>

<div id="scramble">正在生成打亂...</div>
<div id="timer-display">0.000</div>

<div id="sidebar">
    <div class="stats-summary">
        <div>AO5: <span id="ao5">--</span></div>
        <div>AO12: <span id="ao12">--</span></div>
    </div>
    <div id="solve-list"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s",
        authDomain: "weifengtimer-17ea9.firebaseapp.com",
        projectId: "weifengtimer-17ea9",
        storageBucket: "weifengtimer-17ea9.firebasestorage.app",
        messagingSenderId: "852083740797",
        appId: "1:852083740797:web:4b2326142554cf8654a114",
        measurementId: "G-REE1EVZ4VJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let solves = [], timerState = "IDLE", startTime, timerInterval, holdTimeout, currentUser = null;
    const display = document.getElementById('timer-display');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userDisplay = document.getElementById('user-display');

    // --- 1. 打亂生成器 (針對不同項目優化) ---
    function generateScramble() {
        const event = document.getElementById('event-select').value;
        let moves = [], mods = ["", "'", "2"], length = 20;
        let scramble = [];

        if (event === "333") { moves = ["U", "D", "L", "R", "F", "B"]; length = 20; }
        else if (event === "222") { moves = ["U", "R", "F"]; length = 9; }
        else if (event === "444") { moves = ["U", "D", "L", "R", "F", "B", "Uw", "Rw", "Fw"]; length = 40; }
        else if (event === "555") { moves = ["U", "D", "L", "R", "F", "B", "Uw", "Dw", "Lw", "Rw", "Fw", "Bw"]; length = 60; }
        else if (event === "pyram") { moves = ["U", "L", "R", "B"]; length = 10; mods = ["", "'"]; }
        else if (event === "minx") { 
            // 五魔方特殊邏輯 (R++, D++, etc)
            for(let i=0; i<70; i++) {
                let m = (i % 2 === 0) ? "R" : "D";
                let d = Math.random() > 0.5 ? "++" : "--";
                scramble.push(m + d);
                if (i % 10 === 9) scramble.push("U" + (Math.random() > 0.5 ? "" : "'") + "<br>");
            }
        }

        if (event !== "minx") {
            let last = "";
            for(let i=0; i<length; i++) {
                let m = moves[Math.floor(Math.random()*moves.length)];
                while(m === last) m = moves[Math.floor(Math.random()*moves.length)];
                scramble.push(m + mods[Math.floor(Math.random()*mods.length)]);
                last = m;
            }
        }
        document.getElementById('scramble').innerHTML = scramble.join(" ");
    }

    // --- 2. 帳號系統 (登入/登出/監聽) ---
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            loginBtn.style.display = "none";
            logoutBtn.style.display = "inline-block";
            userDisplay.innerText = user.displayName;
            const data = await getDoc(doc(db, "users", user.uid));
            if (data.exists()) solves = data.data().solves || [];
            updateUI();
        } else {
            currentUser = null;
            loginBtn.style.display = "inline-block";
            logoutBtn.style.display = "none";
            userDisplay.innerText = "";
            solves = [];
            updateUI();
        }
    });

    loginBtn.onclick = () => { loginBtn.blur(); signInWithPopup(auth, provider); };
    logoutBtn.onclick = () => { if(confirm("確定登出？")) signOut(auth); };

    // --- 3. 計時功能 (攔截空白鍵) ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); handleDown(); }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') { e.preventDefault(); handleUp(); }
    });

    function handleDown() {
        if (timerState === "RUNNING") stopTimer();
        else if (timerState === "IDLE") {
            timerState = "READY";
            display.style.color = "var(--ready)";
            holdTimeout = setTimeout(() => {
                timerState = "GO";
                display.style.color = "var(--go)";
                display.innerText = "0.000";
            }, 500);
        }
    }

    function handleUp() {
        clearTimeout(holdTimeout);
        if (timerState === "GO") {
            startTime = performance.now();
            timerInterval = setInterval(() => {
                display.innerText = ((performance.now() - startTime) / 1000).toFixed(3);
            }, 10);
            timerState = "RUNNING";
            display.style.color = "var(--text)";
        } else {
            timerState = "IDLE";
            display.style.color = "var(--text)";
        }
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerState = "IDLE";
        const finalTime = parseFloat(((performance.now() - startTime) / 1000).toFixed(3));
        solves.unshift({ time: finalTime, id: Date.now() });
        updateUI();
        syncToCloud();
        generateScramble();
    }

    // --- 4. 統計與 UI ---
    function updateUI() {
        const ao5 = calculateAverage(5);
        const ao12 = calculateAverage(12);
        document.getElementById('ao5').innerText = ao5;
        document.getElementById('ao12').innerText = ao12;

        const list = document.getElementById('solve-list');
        list.innerHTML = solves.map(s => `
            <div class="solve-item">
                <span>${s.time.toFixed(3)}</span>
                <button onclick="window.delSolve(${s.id})">X</button>
            </div>
        `).join('');
    }

    function calculateAverage(n) {
        if (solves.length < n) return "--";
        let recent = solves.slice(0, n).map(s => s.time);
        recent.sort((a, b) => a - b);
        recent.pop(); recent.shift();
        return (recent.reduce((a, b) => a + b, 0) / (n - 2)).toFixed(3);
    }

    window.delSolve = (id) => {
        solves = solves.filter(s => s.id !== id);
        updateUI(); syncToCloud();
    };

    async function syncToCloud() { if(currentUser) await setDoc(doc(db, "users", currentUser.uid), {solves}); }

    document.getElementById('event-select').onchange = generateScramble;
    generateScramble();
</script>
</body>
</html>
