<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - Professional Final</title>
    <style>
        :root { 
            --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; 
            --ready: #ff4757; --go: #2ed573; --subtext: #888;
        }
        body.light-theme { --bg: #f5f5f5; --panel: #fff; --text: #333; --accent: #007bff; }
        
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; user-select: none; }

        /* 左側導航 */
        #social-bar { width: 300px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        #social-bar.collapsed { transform: translateX(-300px); position: absolute; height: 100%; }
        .nav-header { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.1); }
        .icon-btn { font-size: 20px; cursor: pointer; background: #333; border: none; color: white; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        /* 主畫面 */
        #main-stage { flex: 1; display: flex; flex-direction: column; position: relative; text-align: center; }
        #scramble { padding: 25px; font-size: 1.2rem; min-height: 70px; max-width: 85%; margin: 0 auto; color: var(--subtext); line-height: 1.4; }
        #timer-display { font-size: 15vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; transition: color 0.1s; }
        
        /* 統計區 */
        #stats-bar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; background: rgba(0,0,0,0.4); padding: 10px 30px; border-radius: 50px; }
        #stats-bar b { color: var(--accent); }

        /* 歷史成績 */
        #history-panel { width: 240px; background: rgba(0,0,0,0.2); padding: 15px; border-left: 1px solid #333; overflow-y: auto; }
        .solve-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; font-size: 0.9rem; }
        .del-btn { color: #ff4757; cursor: pointer; padding: 0 5px; font-weight: bold; }

        /* 好友列表 */
        .friend-item { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .friend-item:hover { background: var(--accent); }

        /* 設定視窗 */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 25px; border-radius: 15px; z-index: 3000; display: none; width: 350px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .modal.active { display: block; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2500; display:none; }
        .overlay.active { display:block; }
        
        .tab-btn { padding: 8px 15px; background: none; border: none; color: var(--subtext); cursor: pointer; font-weight: bold; }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .tab-content { display: none; padding-top: 15px; }
        .tab-content.active { display: block; }

        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; margin: 8px 0; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="overlay" id="modal-overlay" onclick="closeAllModals()"></div>

<div id="social-bar">
    <div class="nav-header">
        <button class="icon-btn" id="hide-sidebar-btn">☰</button>
        <button class="icon-btn" onclick="openModal('modal-settings')">⚙️</button>
    </div>
    <div id="user-info-card" style="padding: 15px; border-bottom: 1px solid #333;">
        <div id="display-name" style="font-weight:bold;">未登入</div>
        <div id="display-id" style="font-size:0.8rem; color:var(--accent);">#Guest</div>
    </div>
    <div style="padding:15px; font-size:0.8rem; color:#666;">好友列表</div>
    <div id="friend-list-ui" style="flex:1; padding:10px; overflow-y:auto;"></div>
</div>

<div id="main-stage">
    <button class="icon-btn" id="show-sidebar-btn" style="position:absolute; left:15px; top:15px; display:none;">☰</button>
    <div id="top-area" style="padding:20px;">
        <select id="event-selector" style="width: auto; background: var(--accent);">
            <option value="333">3x3x3</option><option value="222">2x2x2</option>
            <option value="444">4x4x4</option><option value="pyram">金字塔</option>
            <option value="minx">五魔方</option>
        </select>
        <div id="scramble">正在載入...</div>
    </div>
    <div id="timer-display">0.000</div>
    <div id="stats-bar">
        <div>AO5: <b id="ao5-val">--</b></div>
        <div>AO12: <b id="ao12-val">--</b></div>
    </div>
</div>

<div id="history-panel">
    <div style="font-weight:bold; margin-bottom:10px; border-bottom:1px solid #444; padding-bottom:5px;">歷史成績</div>
    <div id="solve-list-ui"></div>
</div>

<div class="modal" id="modal-settings">
    <div style="display:flex; justify-content:space-around; border-bottom:1px solid #444;">
        <button class="tab-btn active" onclick="switchTab(event, 'tab-account')">帳號</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-display')">顯示</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-timer')">計時器</button>
    </div>

    <div id="tab-account" class="tab-content active">
        <div id="login-section">
            <button class="btn" id="login-btn">使用 Google 登入</button>
        </div>
        <div id="profile-section" style="display:none;">
            <label>名字</label><input type="text" id="name-input">
            <label>ID</label><input type="text" id="id-input">
            <button class="btn" id="save-profile">儲存修改</button>
            <button class="btn" id="logout-btn" style="background:#444">登出</button>
        </div>
    </div>

    <div id="tab-display" class="tab-content">
        <label>主題</label>
        <select onchange="document.body.className=this.value+'-theme'"><option value="dark">深色</option><option value="light">明亮</option></select>
        <div style="display:flex; justify-content:space-between; margin:15px 0;">顯示打亂 <input type="checkbox" id="scramble-toggle" checked style="width:20px;"></div>
    </div>

    <div id="tab-timer" class="tab-content">
        <label>觀察時間</label><select id="ins-select"><option value="0">關閉</option><option value="15">15 秒</option></select>
        <label>小數點位數</label><select id="dec-select"><option value="2">2 位</option><option value="3" selected>3 位</option></select>
    </div>
    <button class="btn" onclick="closeAllModals()" style="background:none; color:var(--subtext)">關閉</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s",
        authDomain: "weifengtimer-17ea9.firebaseapp.com",
        projectId: "weifengtimer-17ea9",
        storageBucket: "weifengtimer-17ea9.firebasestorage.app",
        messagingSenderId: "852083740797",
        appId: "1:852083740797:web:4b2326142554cf8654a114"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null, allData = {}, currentEvent = "333", currentScramble = "";
    let timerState = "IDLE", startTime, timerInterval, holdTimeout, inspectionTimeout;

    // --- 打亂邏輯 ---
    const genMoves = (moves, len) => {
        let res = [], last = "";
        for(let i=0; i<len; i++){
            let m = moves[Math.floor(Math.random()*moves.length)];
            while(m === last) m = moves[Math.floor(Math.random()*moves.length)];
            res.push(m + ["","'","2"][Math.floor(Math.random()*3)]); last = m;
        }
        return res.join(" ");
    };
    const scramblers = {
        "333": () => genMoves(["U","D","L","R","F","B"], 20),
        "222": () => genMoves(["U","R","F"], 9),
        "444": () => genMoves(["U","D","L","R","F","B","Uw","Rw","Fw"], 40),
        "pyram": () => {
            let s = genMoves(["U","L","R","B"], 10);
            ["u","l","r","b"].forEach(t => { if(Math.random()>0.5) s += ` ${t}${Math.random()>0.5?"'":""}`; });
            return s;
        },
        "minx": () => {
            let s = ""; for(let i=0; i<7; i++){
                for(let j=0; j<10; j++) s += (Math.random()>0.5?"R++ ":"R-- ") + (Math.random()>0.5?"D++ ":"D-- ");
                s += "U\n";
            } return s;
        }
    };
    function generateScramble() {
        currentScramble = (scramblers[currentEvent] || scramblers["333"])();
        document.getElementById('scramble').innerText = document.getElementById('scramble-toggle').checked ? currentScramble : "---";
    }

    // --- UI 與 數據 ---
    window.switchTab = (e, id) => {
        document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
        e.target.classList.add('active'); document.getElementById(id).classList.add('active');
    };
    window.openModal = (id) => { document.getElementById('modal-overlay').classList.add('active'); document.getElementById(id).classList.add('active'); };
    window.closeAllModals = () => document.querySelectorAll('.modal, .overlay').forEach(el => el.classList.remove('active'));

    function renderHistory() {
        const solves = allData[currentEvent] || [];
        const dec = document.getElementById('dec-select').value;
        document.getElementById('solve-list-ui').innerHTML = solves.map((s, idx) => `
            <div class="solve-item"><b>${s.time.toFixed(dec)}s</b><span class="del-btn" onclick="deleteSolve(${idx})">✕</span></div>
        `).join('');
        
        const avg = (n) => {
            if(solves.length < n) return "--";
            const lastN = solves.slice(0, n).map(s => s.time);
            return (lastN.reduce((a,b)=>a+b, 0)/n).toFixed(3);
        };
        document.getElementById('ao5-val').innerText = avg(5);
        document.getElementById('ao12-val').innerText = avg(12);
    }

    window.deleteSolve = (idx) => {
        if(confirm("刪除這筆成績？")) {
            allData[currentEvent].splice(idx, 1);
            renderHistory();
            if(currentUser) updateDoc(doc(db, "users", currentUser.uid), { allData });
        }
    };

    // --- 計時器核心 (含亮燈預備) ---
    const display = document.getElementById('timer-display');
    function stopTimer() {
        clearInterval(timerInterval); timerState = "IDLE";
        const time = parseFloat(((performance.now() - startTime) / 1000).toFixed(3));
        if(!allData[currentEvent]) allData[currentEvent] = [];
        allData[currentEvent].unshift({ time, id: Date.now() });
        renderHistory(); generateScramble();
        if(currentUser) updateDoc(doc(db, "users", currentUser.uid), { allData });
        display.style.color = "var(--text)";
    }

    function startTimer() {
        clearInterval(inspectionTimeout);
        startTime = performance.now();
        timerInterval = setInterval(() => {
            display.innerText = ((performance.now()-startTime)/1000).toFixed(document.getElementById('dec-select').value);
        }, 10);
        timerState = "RUNNING"; display.style.color = "var(--text)";
    }

    window.onkeydown = (e) => {
        if(e.code === 'Space'){
            e.preventDefault();
            if(timerState === "RUNNING") stopTimer();
            else if(timerState === "IDLE") {
                timerState = "READY"; display.style.color = "var(--ready)";
                holdTimeout = setTimeout(() => {
                    timerState = "GO"; display.style.color = "var(--go)"; display.innerText = "0.000";
                }, 500);
            } else if(timerState === "INSPECTION") startTimer();
        }
    };
    window.onkeyup = (e) => {
        if(e.code === 'Space'){
            clearTimeout(holdTimeout);
            if(timerState === "GO") {
                const ins = document.getElementById('ins-select').value;
                if(ins > 0) {
                    timerState = "INSPECTION"; let left = ins; display.style.color = "var(--ready)";
                    inspectionTimeout = setInterval(() => { left--; display.innerText = left; if(left<=0) startTimer(); }, 1000);
                } else startTimer();
            } else { timerState = "IDLE"; display.style.color = "var(--text)"; }
        }
    };

    // --- Firebase 社交 ---
    onAuthStateChanged(auth, async user => {
        if(user) {
            currentUser = user;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('profile-section').style.display = 'block';
            onSnapshot(doc(db, "users", user.uid), s => {
                if(s.exists()){
                    const d = s.data(); allData = d.allData || {};
                    document.getElementById('display-name').innerText = d.displayName;
                    document.getElementById('display-id').innerText = "#" + d.customID;
                    document.getElementById('name-input').value = d.displayName;
                    document.getElementById('id-input').value = d.customID;
                    renderHistory(); if(d.friends?.length) syncFriends(d.friends);
                }
            });
        }
    });

    function syncFriends(uids) {
        const q = query(collection(db, "users"), where("__name__", "in", uids));
        onSnapshot(q, s => {
            document.getElementById('friend-list-ui').innerHTML = s.docs.map(d => `
                <div class="friend-item"><b>${d.data().displayName}</b><br><small>#${d.data().customID}</small></div>
            `).join('');
        });
    }

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(()=>location.reload());
    document.getElementById('save-profile').onclick = () => updateDoc(doc(db, "users", currentUser.uid), { displayName: document.getElementById('name-input').value, customID: document.getElementById('id-input').value }).then(()=>alert("已儲存"));
    document.getElementById('event-selector').onchange = (e) => { currentEvent = e.target.value; generateScramble(); renderHistory(); };
    document.getElementById('hide-sidebar-btn').onclick = () => { document.getElementById('social-bar').classList.add('collapsed'); document.getElementById('show-sidebar-btn').style.display='flex'; };
    document.getElementById('show-sidebar-btn').onclick = () => { document.getElementById('social-bar').classList.remove('collapsed'); document.getElementById('show-sidebar-btn').style.display='none'; };

    generateScramble();
</script>
</body>
</html>
