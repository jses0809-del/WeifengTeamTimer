<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - Professional Legacy</title>
    <style>
        :root { 
            --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; 
            --ready: #ff4757; --go: #2ed573; --subtext: #888; --border: #333;
        }
        /* 主題設定 */
        body.dark-theme { --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; }
        body.light-theme { --bg: #f5f5f5; --panel: #fff; --text: #333; --accent: #007bff; --border: #ddd; }
        body.cyber-theme { --bg: #0d0221; --panel: #261447; --text: #ff0055; --accent: #00f2ff; }
        body.sakura-theme { --bg: #fff5f8; --panel: #ffe0e9; --text: #d4418e; --accent: #ff85a2; }
        body.gold-theme { --bg: #1a1a1a; --panel: #2c2c2c; --text: #d4af37; --accent: #ffd700; }
        body.ocean-theme { --bg: #001219; --panel: #005f73; --text: #fff; --accent: #94d2bd; }
        body.midnight-theme { --bg: #000; --panel: #111; --text: #fff; --accent: #444; }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; user-select: none; transition: background 0.3s, color 0.3s; }

        /* 左側導航 */
        #social-bar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        #social-bar.collapsed { transform: translateX(-320px); position: absolute; height: 100%; }
        .nav-header { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.1); }
        .icon-btn { font-size: 18px; cursor: pointer; background: rgba(150,150,150,0.1); border: none; color: var(--text); width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }

        /* UI 元件修正：文字顏色跟隨變數 */
        input, select { 
            width: 100%; padding: 12px; 
            background: rgba(150,150,150,0.1); 
            border: 1px solid var(--border); 
            color: var(--text); /* 修正：不再固定為白色 */
            border-radius: 8px; margin: 10px 0; box-sizing: border-box; 
        }
        option { background: var(--panel); color: var(--text); } /* 修正：下拉選項顏色 */

        /* 主畫面與計時器 */
        #main-stage { flex: 1; display: flex; flex-direction: column; text-align: center; position: relative; }
        #timer-display { font-size: 16vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; }
        #scramble { font-size: 1.25rem; min-height: 80px; color: var(--subtext); padding: 20px; line-height: 1.5; }

        /* 設定視窗 */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); border-radius: 15px; z-index: 3000; display: none; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid var(--border); overflow: hidden; }
        .modal.active { display: block; }
        .modal-nav { display: flex; background: rgba(0,0,0,0.05); }
        .modal-tab { flex: 1; padding: 15px; border: none; background: none; color: var(--subtext); cursor: pointer; }
        .modal-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .modal-content { padding: 20px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2500; display:none; }
        .overlay.active { display:block; }
        .btn { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body class="dark-theme">

<div class="overlay" id="modal-overlay" onclick="closeAllModals()"></div>

<div id="social-bar">
    <div class="nav-header">
        <button class="icon-btn" id="hide-sidebar-btn">☰</button>
        <button class="icon-btn" onclick="openModal('modal-settings')">⚙️</button>
    </div>
    <div style="padding: 20px;">
        <div id="display-name-side" data-t="guestName" style="font-weight: bold;">未登入</div>
        <div id="display-id-side" style="color: var(--accent);">#Guest</div>
    </div>
    <div class="f-tabs">
        <button class="f-tab-btn active" data-t="tabFriends" onclick="switchF(event, 'f-list')">好友</button>
        <button class="f-tab-btn" data-t="tabApply" onclick="switchF(event, 'f-apply')">申請</button>
    </div>
    <div id="f-list" style="padding: 10px; flex: 1; overflow-y: auto;"></div>
</div>

<div id="main-stage" onmousedown="handleTouchStart(event)" onmouseup="handleTouchEnd(event)">
    <button class="icon-btn" id="show-sidebar-btn" style="position:absolute; left:15px; top:15px; display:none;">☰</button>
    <div id="top-area" style="padding: 20px;">
        <select id="event-selector" style="width: auto; background: var(--accent); color: white;">
            <option value="333">3x3x3</option>
            <option value="222">2x2x2</option>
            <option value="444">4x4x4</option>
        </select>
        <div id="scramble">...</div>
    </div>
    <div id="timer-display">0.000</div>
    <div id="stats-bar" style="padding: 20px; display: flex; justify-content: center; gap: 30px;">
        <div>AO5: <b id="ao5-val">--</b></div>
        <div>AO12: <b id="ao12-val">--</b></div>
    </div>
</div>

<div class="modal" id="modal-settings">
    <div class="modal-nav">
        <button class="modal-tab active" data-t="stAcc" onclick="switchST(event, 'st-acc')">帳號</button>
        <button class="modal-tab" data-t="stUI" onclick="switchST(event, 'st-ui')">介面</button>
        <button class="modal-tab" data-t="stTimer" onclick="switchST(event, 'st-timer')">計時</button>
    </div>
    <div class="modal-content">
        <div id="st-acc" class="tab-pane active">
            <button class="btn" data-t="loginBtn" onclick="login()">Google 登入</button>
        </div>
        <div id="st-ui" class="tab-pane">
            <label data-t="langSet">語言</label>
            <select id="lang-selector">
                <option value="zh-TW">繁體中文</option>
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
            </select>
            <label data-t="themeSet">主題</label>
            <select onchange="document.body.className=this.value+'-theme'">
                <option value="dark">Dark</option><option value="light">Light</option>
                <option value="cyber">Cyberpunk</option><option value="sakura">Sakura</option>
                <option value="gold">Gold</option><option value="midnight">Midnight</option>
            </select>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <span data-t="showScramble">顯示打亂</span>
                <input type="checkbox" id="sc-check" checked style="width:20px;">
            </div>
        </div>
        <div id="st-timer" class="tab-pane">
            <label data-t="startMode">開始方式</label>
            <select id="start-type">
                <option value="kb" data-t="optKb">空白鍵</option>
                <option value="touch" data-t="optTouch">觸控 / 滑鼠點擊</option>
            </select>
            <label data-t="insMode">觀察時間</label>
            <select id="ins-sel">
                <option value="0">OFF</option>
                <option value="15">15s</option>
            </select>
        </div>
        <button class="btn" style="margin-top:20px; background:#666;" data-t="closeBtn" onclick="closeAllModals()">關閉</button>
    </div>
</div>

<script type="module">
    // --- 語言包 ---
    const i18n = {
        "zh-TW": { guestName: "未登入", tabFriends: "好友", tabApply: "申請", stAcc: "帳號", stUI: "介面", stTimer: "計時", loginBtn: "Google 登入", langSet: "語言選擇", themeSet: "主題切換", showScramble: "顯示打亂公式", startMode: "開始方式", optKb: "空白鍵", optTouch: "觸控 / 點擊", insMode: "觀察時間", closeBtn: "關閉" },
        "zh-CN": { guestName: "未登录", tabFriends: "好友", tabApply: "申请", stAcc: "账号", stUI: "界面", stTimer: "计时", loginBtn: "Google 登录", langSet: "语言选择", themeSet: "主题切换", showScramble: "显示打乱公式", startMode: "开始方式", optKb: "空格键", optTouch: "触控 / 点击", insMode: "观察时间", closeBtn: "关闭" },
        "en": { guestName: "Guest", tabFriends: "Friends", tabApply: "Apply", stAcc: "Account", stUI: "UI", stTimer: "Timer", loginBtn: "Google Login", langSet: "Language", themeSet: "Theme", showScramble: "Show Scramble", startMode: "Start Method", optKb: "Spacebar", optTouch: "Touch / Click", insMode: "Inspection", closeBtn: "Close" },
        "ja": { guestName: "ゲスト", tabFriends: "フレンド", tabApply: "申請", stAcc: "アカウント", stUI: "表示", stTimer: "計測", loginBtn: "Googleでログイン", langSet: "言語設定", themeSet: "テーマ設定", showScramble: "スクランブル表示", startMode: "スタート方法", optKb: "スペースキー", optTouch: "タッチ / クリック", insMode: "インスペクション", closeBtn: "閉じる" }
    };

    let currentEvent = "333", currentScramble = "";
    let timerState = "IDLE", startTime, timerInterval, holdTimeout;

    // --- 核心邏輯 ---
    function updateLanguage(lang) {
        document.querySelectorAll('[data-t]').forEach(el => {
            const key = el.getAttribute('data-t');
            if (i18n[lang][key]) el.innerText = i18n[lang][key];
        });
    }

    function generateScramble() {
        const moves = { "333": ["U","D","L","R","F","B"], "222": ["U","R","F"], "444": ["U","D","L","R","F","B","Uw","Rw"] };
        let m = moves[currentEvent], res = [], last = "";
        for(let i=0; i<(currentEvent==="444"?40:20); i++){
            let move = m[Math.floor(Math.random()*m.length)];
            while(move === last) move = m[Math.floor(Math.random()*m.length)];
            res.push(move + ["","'","2"][Math.floor(Math.random()*3)]); last = move;
        }
        currentScramble = res.join(" ");
        refreshScrambleUI();
    }

    function refreshScrambleUI() {
        document.getElementById('scramble').innerText = document.getElementById('sc-check').checked ? currentScramble : "";
    }

    // --- 計時觸發器 ---
    window.onkeydown = (e) => { if(e.code === 'Space' && document.getElementById('start-type').value === 'kb') handleStart(); };
    window.onkeyup = (e) => { if(e.code === 'Space' && document.getElementById('start-type').value === 'kb') handleEnd(); };
    
    window.handleTouchStart = (e) => { if(document.getElementById('start-type').value === 'touch') handleStart(); };
    window.handleTouchEnd = (e) => { if(document.getElementById('start-type').value === 'touch') handleEnd(); };

    function handleStart() {
        if(timerState === "RUNNING") { stopTimer(); return; }
        if(timerState === "IDLE") {
            timerState = "READY"; document.getElementById('timer-display').style.color = "var(--ready)";
            holdTimeout = setTimeout(() => { timerState = "GO"; document.getElementById('timer-display').style.color = "var(--go)"; }, 500);
        }
    }

    function handleEnd() {
        clearTimeout(holdTimeout);
        if(timerState === "GO") startTimer();
        else { timerState = "IDLE"; document.getElementById('timer-display').style.color = "var(--text)"; }
    }

    function startTimer() {
        startTime = performance.now();
        timerInterval = setInterval(() => {
            document.getElementById('timer-display').innerText = ((performance.now()-startTime)/1000).toFixed(3);
        }, 10);
        timerState = "RUNNING";
        document.getElementById('timer-display').style.color = "var(--text)";
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerState = "IDLE";
        generateScramble();
    }

    // UI 事件
    document.getElementById('sc-check').onchange = refreshScrambleUI;
    document.getElementById('lang-selector').onchange = (e) => updateLanguage(e.target.value);
    document.getElementById('event-selector').onchange = (e) => { currentEvent = e.target.value; generateScramble(); };
    
    window.openModal = (id) => { document.getElementById('modal-overlay').classList.add('active'); document.getElementById(id).classList.add('active'); };
    window.closeAllModals = () => document.querySelectorAll('.modal, .overlay').forEach(el => el.classList.remove('active'));
    window.switchST = (e, id) => { 
        document.querySelectorAll('.modal-tab, .tab-pane').forEach(el=>el.classList.remove('active')); 
        e.target.classList.add('active'); document.getElementById(id).classList.add('active'); 
    };

    // 初始化
    generateScramble();
    updateLanguage('zh-TW');
</script>
</body>
</html>
