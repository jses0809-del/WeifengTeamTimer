<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - Social Pro Max</title>
    <style>
        :root { 
            --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; 
            --ready: #ff4757; --go: #2ed573; --subtext: #888;
        }
        /* 十二種主題配方 */
        body.dark-theme { --bg: #121212; --panel: #1e1e1e; --accent: #3742fa; }
        body.light-theme { --bg: #f5f5f5; --panel: #ffffff; --text: #333; --accent: #007bff; }
        body.cyber-theme { --bg: #0d0221; --panel: #261447; --text: #ff0055; --accent: #00f2ff; }
        body.forest-theme { --bg: #1b2e1b; --panel: #2d4a2d; --accent: #78e08f; }
        body.sakura-theme { --bg: #fff5f8; --panel: #ffe0e9; --text: #d4418e; --accent: #ff85a2; }
        body.gold-theme { --bg: #1a1a1a; --panel: #2c2c2c; --text: #d4af37; --accent: #ffd700; }
        body.ocean-theme { --bg: #001219; --panel: #005f73; --accent: #94d2bd; }
        body.midnight-theme { --bg: #000000; --panel: #111; --accent: #5e5e5e; }
        body.lava-theme { --bg: #2b0000; --panel: #4a0000; --text: #ff9f1a; --accent: #ff4757; }
        body.purple-theme { --bg: #240046; --panel: #3c096c; --accent: #9d4edd; }
        body.mint-theme { --bg: #f0fff4; --panel: #c6f6d5; --text: #22543d; --accent: #38a169; }
        body.slate-theme { --bg: #1e293b; --panel: #334155; --accent: #94a3b8; }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; user-select: none; }

        /* 左側導航系統 */
        #social-bar { width: 320px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        #social-bar.collapsed { transform: translateX(-320px); position: absolute; height: 100%; }
        .nav-header { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.1); }
        .icon-btn { font-size: 20px; cursor: pointer; background: #333; border: none; color: white; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        /* 好友分頁 */
        #friend-tabs { display: flex; border-bottom: 1px solid #444; }
        .f-tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--subtext); cursor: pointer; }
        .f-tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        /* 主畫面 */
        #main-stage { flex: 1; display: flex; flex-direction: column; position: relative; text-align: center; }
        #scramble { padding: 25px; font-size: 1.2rem; min-height: 70px; color: var(--subtext); }
        #timer-display { font-size: 15vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; }
        
        #stats-bar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; background: rgba(0,0,0,0.4); padding: 10px 30px; border-radius: 50px; }

        /* 歷史成績 */
        #history-panel { width: 240px; background: rgba(0,0,0,0.1); padding: 15px; border-left: 1px solid #333; overflow-y: auto; }
        .solve-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #444; cursor: pointer; }
        .del-btn { color: #ff4757; }

        /* 彈窗系統 */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 25px; border-radius: 15px; z-index: 3000; display: none; width: 380px; box-shadow: 0 0 50px #000; }
        .modal.active { display: block; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2500; display:none; }
        .overlay.active { display:block; }
        
        .chat-msg { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px; margin-bottom: 5px; font-size: 0.9rem; }
        .solve-link { color: var(--accent); text-decoration: underline; cursor: pointer; }

        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; margin: 8px 0; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body class="dark-theme">

<div class="overlay" id="modal-overlay" onclick="closeAllModals()"></div>

<div id="social-bar">
    <div class="nav-header">
        <button class="icon-btn" id="hide-sidebar-btn">☰</button>
        <button class="icon-btn" onclick="openModal('modal-settings')">⚙️</button>
    </div>
    <div id="friend-tabs">
        <button class="f-tab-btn active" onclick="switchFriendTab(event, 'list-view')">好友列表</button>
        <button class="f-tab-btn" onclick="switchFriendTab(event, 'apply-view')">申請好友</button>
    </div>
    
    <div id="list-view" class="friend-page active" style="padding:10px; flex:1; overflow-y:auto;">
        <div id="friend-list-ui"></div>
    </div>
    
    <div id="apply-view" class="friend-page" style="padding:15px; display:none;">
        <input type="text" id="apply-id-input" placeholder="輸入好友 ID">
        <button class="btn" onclick="sendFriendRequest()">申請好友</button>
        <div style="margin-top:20px; font-size:0.8rem; color:var(--subtext);">待處理申請</div>
        <div id="request-list-ui"></div>
    </div>
</div>

<div id="main-stage">
    <button class="icon-btn" id="show-sidebar-btn" style="position:absolute; left:15px; top:15px; display:none;">☰</button>
    <div id="top-area" style="padding:20px;">
        <select id="event-selector" style="width: auto; background: var(--accent);">
            <option value="333">3x3x3</option><option value="222">2x2x2</option>
            <option value="444">4x4x4</option><option value="pyram">金字塔</option>
            <option value="minx">五魔方</option>
        </select>
        <div id="scramble">正在生成...</div>
    </div>
    <div id="timer-display">0.000</div>
    <div id="stats-bar">
        <div>AO5: <b id="ao5-val">--</b></div>
        <div>AO12: <b id="ao12-val">--</b></div>
    </div>
</div>

<div id="history-panel">
    <div style="font-weight:bold; margin-bottom:10px;">歷史成績</div>
    <div id="solve-list-ui"></div>
</div>

<div class="modal" id="modal-chat">
    <h3 id="chat-name">好友名字</h3>
    <div id="chat-box" style="height:200px; overflow-y:auto; border:1px solid #444; padding:10px; margin-bottom:10px;"></div>
    <div style="display:flex; gap:5px;">
        <input type="text" id="chat-input" placeholder="說點什麼...">
        <button class="btn" style="width:70px" onclick="sendMessage()">發送</button>
    </div>
    <button class="btn" style="background:none; color:#888" onclick="closeAllModals()">關閉</button>
</div>

<div class="modal" id="modal-settings">
    <div style="display:flex; justify-content:space-around; border-bottom:1px solid #444;">
        <button class="tab-btn active" onclick="switchSetTab(event, 'set-acc')">帳號</button>
        <button class="tab-btn" onclick="switchSetTab(event, 'set-ui')">顯示</button>
        <button class="tab-btn" onclick="switchSetTab(event, 'set-timer')">計時器</button>
    </div>
    <div id="set-acc" class="set-page active">
        <div id="login-sec"><button class="btn" id="login-btn">Google 登入</button></div>
        <div id="profile-sec" style="display:none;">
            <label>名字</label><input type="text" id="name-input">
            <label>ID</label><input type="text" id="id-input">
            <button class="btn" id="save-profile">儲存</button>
        </div>
    </div>
    <div id="set-ui" class="set-page" style="display:none;">
        <label>主題選擇</label>
        <select onchange="document.body.className=this.value+'-theme'">
            <option value="dark">深色專業</option><option value="light">明亮模式</option>
            <option value="cyber">賽博龐克</option><option value="forest">森林木紋</option>
            <option value="sakura">粉色櫻花</option><option value="gold">黑金尊爵</option>
            <option value="ocean">深海藍調</option><option value="midnight">極致全黑</option>
            <option value="lava">烈焰岩漿</option><option value="purple">星空紫</option>
            <option value="mint">清新薄荷</option><option value="slate">灰藍岩板</option>
        </select>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s",
        authDomain: "weifengtimer-17ea9.firebaseapp.com",
        projectId: "weifengtimer-17ea9",
        storageBucket: "weifengtimer-17ea9.firebasestorage.app",
        messagingSenderId: "852083740797",
        appId: "1:852083740797:web:4b2326142554cf8654a114"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null, allData = {}, currentEvent = "333", currentScramble = "", currentChatFriend = null;
    let timerState = "IDLE", startTime, timerInterval, holdTimeout;

    // --- 核心邏輯：打亂與計時 ---
    const scramblers = { "333": () => genMoves(["U","D","L","R","F","B"], 20), "222": () => genMoves(["U","R","F"], 9) };
    function genMoves(moves, len) {
        let res = [], last = "";
        for(let i=0; i<len; i++){
            let m = moves[Math.floor(Math.random()*moves.length)];
            while(m === last) m = moves[Math.floor(Math.random()*moves.length)];
            res.push(m + ["","'","2"][Math.floor(Math.random()*3)]); last = m;
        } return res.join(" ");
    }
    function generateScramble() { currentScramble = (scramblers[currentEvent] || scramblers["333"])(); document.getElementById('scramble').innerText = currentScramble; }

    function renderHistory() {
        const solves = allData[currentEvent] || [];
        document.getElementById('solve-list-ui').innerHTML = solves.map((s, idx) => `
            <div class="solve-item" onclick="alert('打亂：'+'${s.scramble || '無紀錄'}')">
                <b>${s.time.toFixed(3)}s</b> <span class="del-btn" onclick="deleteSolve(event, ${idx})">✕</span>
            </div>
        `).join('');
        const avg = (n) => solves.length < n ? "--" : (solves.slice(0,n).reduce((a,b)=>a+b.time,0)/n).toFixed(3);
        document.getElementById('ao5-val').innerText = avg(5);
        document.getElementById('ao12-val').innerText = avg(12);
    }

    // --- 亮燈預備與計時 ---
    const display = document.getElementById('timer-display');
    window.onkeydown = (e) => {
        if(e.code === 'Space'){
            e.preventDefault();
            if(timerState === "RUNNING") {
                clearInterval(timerInterval); timerState = "IDLE";
                const time = parseFloat(((performance.now() - startTime) / 1000).toFixed(3));
                if(!allData[currentEvent]) allData[currentEvent] = [];
                allData[currentEvent].unshift({ time, id: Date.now(), scramble: currentScramble });
                renderHistory(); generateScramble();
                if(currentUser) updateDoc(doc(db, "users", currentUser.uid), { allData });
                display.style.color = "var(--text)";
            } else if(timerState === "IDLE") {
                timerState = "READY"; display.style.color = "var(--ready)";
                holdTimeout = setTimeout(() => { timerState = "GO"; display.style.color = "var(--go)"; display.innerText = "0.000"; }, 500);
            }
        }
    };
    window.onkeyup = (e) => {
        if(e.code === 'Space'){
            clearTimeout(holdTimeout);
            if(timerState === "GO") {
                startTime = performance.now();
                timerInterval = setInterval(() => { display.innerText = ((performance.now()-startTime)/1000).toFixed(3); }, 10);
                timerState = "RUNNING"; display.style.color = "var(--text)";
            } else { timerState = "IDLE"; display.style.color = "var(--text)"; }
        }
    };

    // --- 社交功能 ---
    window.switchFriendTab = (e, id) => {
        document.querySelectorAll('.f-tab-btn, .friend-page').forEach(el => { el.classList.remove('active'); el.style.display = 'none'; });
        e.target.classList.add('active'); e.target.style.display = 'block';
        document.getElementById(id).style.display = 'block';
    };

    onAuthStateChanged(auth, async user => {
        if(user) {
            currentUser = user;
            document.getElementById('login-sec').style.display = 'none';
            document.getElementById('profile-sec').style.display = 'block';
            onSnapshot(doc(db, "users", user.uid), s => {
                if(s.exists()){
                    const d = s.data(); allData = d.allData || {};
                    document.getElementById('name-input').value = d.displayName;
                    document.getElementById('id-input').value = d.customID;
                    renderHistory();
                    if(d.requests?.length) renderRequests(d.requests);
                    if(d.friends?.length) syncFriends(d.friends);
                }
            });
        }
    });

    window.sendFriendRequest = async () => {
        const id = document.getElementById('apply-id-input').value;
        const q = query(collection(db, "users"), where("customID", "==", id));
        // 邏輯：找到該 ID 的 user，並在其 requests 陣列加入 currentUser.uid
        alert("申請已發送 (需搭配後端搜尋邏輯)");
    };

    // 更多好友、聊天邏輯...
    window.openModal = (id) => { document.getElementById('modal-overlay').classList.add('active'); document.getElementById(id).classList.add('active'); };
    window.closeAllModals = () => document.querySelectorAll('.modal, .overlay').forEach(el => el.classList.remove('active'));
    window.switchSetTab = (e, id) => {
        document.querySelectorAll('.tab-btn, .set-page').forEach(el => { el.classList.remove('active'); el.style.display = 'none'; });
        e.target.classList.add('active'); e.target.style.display = 'block';
        document.getElementById(id).style.display = 'block';
    };

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
    generateScramble();
</script>
</body>
</html>
