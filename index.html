<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - Social Pro</title>
    <style>
        :root {
            --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa;
            --ready: #ff4757; --go: #2ed573; --subtext: #888;
        }
        body.dark-theme { --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; }
        body.light-theme { --bg: #f5f5f5; --panel: #ffffff; --text: #333; --accent: #007bff; }
        body.cyber-theme { --bg: #0d0221; --panel: #261447; --text: #ff0055; --accent: #00f2ff; }
        body.sakura-theme { --bg: #fff5f8; --panel: #ffe0e9; --text: #d4418e; --accent: #ff85a2; }
        body.gold-theme { --bg: #1a1a1a; --panel: #2c2c2c; --text: #d4af37; --accent: #ffd700; }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; user-select: none; }

        /* 左側導航 */
        #social-bar { width: 300px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; transition: 0.3s; z-index: 1000; }
        #social-bar.collapsed { transform: translateX(-300px); position: absolute; height: 100%; }
        .nav-header { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.1); }
        .icon-btn { font-size: 20px; cursor: pointer; background: #333; border: none; color: white; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        /* 好友區塊強化 */
        .search-box { padding: 10px; display: flex; gap: 5px; }
        .search-box input { flex: 1; margin: 0; font-size: 0.8rem; }
        .friend-list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .friend-group-title { font-size: 0.75rem; color: var(--subtext); margin: 10px 0 5px; text-transform: uppercase; letter-spacing: 1px; }
        .friend-card { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; }
        .friend-info { display: flex; flex-direction: column; }
        .friend-id { font-size: 0.7rem; color: var(--accent); }
        .friend-actions { display: flex; gap: 5px; }
        .f-btn { border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }
        .f-btn.accept { background: var(--go); color: #000; }
        .f-btn.reject { background: #444; color: #fff; }

        /* 主畫面 */
        #main-stage { flex: 1; display: flex; flex-direction: column; position: relative; text-align: center; }
        #scramble { padding: 25px; font-size: 1.1rem; min-height: 70px; color: var(--subtext); line-height: 1.4; white-space: normal; word-break: break-word; }
        #timer-display { font-size: 15vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; }
        
        #history-panel { width: 250px; background: rgba(0,0,0,0.1); padding: 15px; border-left: 1px solid #333; overflow-y: auto; }
        .solve-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #444; cursor: pointer; }
        .del-btn { color: #ff4757; font-weight: bold; padding: 5px; }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 25px; border-radius: 15px; z-index: 3000; display: none; width: 380px; box-shadow: 0 0 50px #000; }
        .modal.active { display: block; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2500; display:none; }
        .overlay.active { display:block; }
        
        .tab-nav { display: flex; border-bottom: 1px solid #444; margin-bottom: 15px; }
        .tab-link { flex:1; padding:10px; background:none; border:none; color:var(--subtext); cursor:pointer; font-weight:bold; }
        .tab-link.active { color:var(--accent); border-bottom: 2px solid var(--accent); }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        input, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body class="dark-theme">

<div class="overlay" id="modal-overlay" onclick="closeAllModals()"></div>

<div id="social-bar">
    <div class="nav-header">
        <button class="icon-btn" id="hide-sidebar-btn">☰</button>
        <button class="icon-btn" onclick="openModal('modal-settings')">⚙️</button>
    </div>
    
    <div id="user-info-card" style="padding: 15px; border-bottom: 1px solid #333;">
        <div id="display-name-sidebar" data-i18n="not_logged_in">未登入</div>
        <div id="display-id-sidebar" style="font-size:0.8rem; color:var(--accent);">#Guest</div>
    </div>

    <div class="search-box">
        <input type="text" id="friend-search-input" placeholder="搜尋 ID...">
        <button class="icon-btn" style="width:35px; height:35px; font-size:14px;" id="find-user-btn">🔍</button>
    </div>

    <div class="friend-list-container">
        <div class="friend-group-title" data-i18n="request_list">好友申請</div>
        <div id="request-section">
            </div>

        <div class="friend-group-title" data-i18n="friend_list">我的好友</div>
        <div id="friend-section">
            </div>
    </div>
</div>

<div id="main-stage">
    <button class="icon-btn" id="show-sidebar-btn" style="position:absolute; left:15px; top:15px; display:none;">☰</button>
    <div id="top-area" style="padding:20px;">
        <select id="event-selector" style="width: auto; background: var(--accent);">
            <option value="333">3x3x3</option>
            <option value="222">2x2x2</option>
            <option value="444">4x4x4</option>
            <option value="pyram">Pyraminx</option>
            <option value="minx">Megaminx</option>
        </select>
        <div id="scramble">Loading...</div>
    </div>
    <div id="timer-display">0.000</div>
    <div id="stats-bar" style="margin-bottom:20px; display:flex; justify-content:center; gap:30px; font-size:1.2rem;">
        <div>AO5: <b id="ao5-val">--</b></div>
        <div>AO12: <b id="ao12-val">--</b></div>
    </div>
</div>

<div id="history-panel">
    <div style="font-weight:bold; margin-bottom:10px;" data-i18n="history">歷史成績</div>
    <div id="solve-list-ui"></div>
</div>

<div class="modal" id="modal-settings">
    <div class="tab-nav">
        <button class="tab-link active" onclick="switchTab(event, 'tab-account')" data-i18n="tab_account">帳號</button>
        <button class="tab-link" onclick="switchTab(event, 'tab-display')" data-i18n="tab_display">顯示</button>
        <button class="tab-link" onclick="switchTab(event, 'tab-timer')" data-i18n="tab_timer">計時器</button>
    </div>

    <div id="tab-account" class="tab-pane active">
        <div id="login-section">
            <button class="btn" id="login-btn" data-i18n="login_google">使用 Google 登入</button>
        </div>
        <div id="profile-section" style="display:none;">
            <label data-i18n="label_name">名字</label><input type="text" id="name-input">
            <label data-i18n="label_id">ID</label><input type="text" id="id-input">
            <button class="btn" id="save-profile" data-i18n="save_btn">儲存修改</button>
            <button class="btn" id="logout-btn" style="background:#444; margin-top:20px;" data-i18n="logout_btn">登出帳號</button>
        </div>
    </div>

    <div id="tab-display" class="tab-pane">
        <label data-i18n="label_theme">主題</label>
        <select id="theme-select" onchange="document.body.className=this.value+'-theme'">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="cyber">Cyberpunk</option>
            <option value="sakura">Sakura</option>
            <option value="gold">Gold</option>
        </select>
        <label data-i18n="label_lang">語言</label>
        <select id="lang-select">
            <option value="zh-TW">繁體中文</option>
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <div id="tab-timer" class="tab-pane">
        <label data-i18n="label_start_method">開始方法</label>
        <select id="start-method">
            <option value="kb" data-i18n="opt_kb">快捷鍵 (空白鍵)</option>
            <option value="tc" data-i18n="opt_tc">觸控開始</option>
        </select>
        <label data-i18n="label_inspection">15秒觀察</label>
        <select id="inspection-select">
            <option value="0" data-i18n="opt_off">關閉</option>
            <option value="15" data-i18n="opt_on">開啟 (15s)</option>
        </select>
        <label data-i18n="label_decimals">小數點位數</label>
        <select id="decimal-select">
            <option value="2">2 位</option>
            <option value="3" selected>3 位</option>
        </select>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, query, where, collection, getDocs, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s",
        authDomain: "weifengtimer-17ea9.firebaseapp.com",
        projectId: "weifengtimer-17ea9",
        storageBucket: "weifengtimer-17ea9.firebasestorage.app",
        messagingSenderId: "852083740797",
        appId: "1:852083740797:web:4b2326142554cf8654a114"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const i18n = {
        "zh-TW": {
            not_logged_in: "未登入", friend_list: "我的好友", history: "歷史成績",
            tab_account: "帳號", tab_display: "顯示", tab_timer: "計時器",
            login_google: "使用 Google 登入", label_name: "名字", label_id: "ID",
            save_btn: "儲存修改", logout_btn: "登出帳號", label_theme: "主題",
            label_lang: "語言", label_start_method: "開始方法", opt_kb: "快捷鍵 (空白鍵)",
            opt_tc: "觸控開始", label_inspection: "15秒觀察", opt_off: "關閉",
            opt_on: "開啟 (15s)", label_decimals: "小數點位數", del_confirm: "確定刪除？",
            save_success: "存檔成功", id_limit: "三週內只能修改兩次 ID！", msg_scramble: "打亂公式：\n",
            request_list: "好友申請", search_placeholder: "搜尋 ID...", friend_sent: "申請已發送！", user_not_found: "找不到該用戶"
        },
        "en": {
            not_logged_in: "Guest", friend_list: "My Friends", history: "History",
            tab_account: "Account", tab_display: "Display", tab_timer: "Timer",
            login_google: "Login with Google", label_name: "Name", label_id: "ID",
            save_btn: "Save Changes", logout_btn: "Logout", label_theme: "Theme",
            label_lang: "Language", label_start_method: "Start Method", opt_kb: "Keyboard (Space)",
            opt_tc: "Touch Start", label_inspection: "Inspection", opt_off: "OFF",
            opt_on: "ON (15s)", label_decimals: "Decimals", del_confirm: "Are you sure?",
            save_success: "Saved!", id_limit: "ID limit reached!", msg_scramble: "Scramble:\n",
            request_list: "Requests", search_placeholder: "Search ID...", friend_sent: "Request Sent!", user_not_found: "User not found"
        }
        // ... (其他語言可依此類推)
    };

    let currentLang = localStorage.getItem('wf_lang') || 'zh-TW';
    let currentUser = null, allData = {}, currentEvent = "333", currentScramble = "";
    let timerState = "IDLE", startTime, timerInterval, holdTimeout, insInterval;

    function updateLanguage() {
        const langData = i18n[currentLang] || i18n["en"];
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (langData[key]) el.innerText = langData[key];
        });
        document.getElementById('friend-search-input').placeholder = langData.search_placeholder;
        localStorage.setItem('wf_lang', currentLang);
    }

    // --- 好友功能邏輯 ---
    async function sendFriendRequest(targetID) {
        if(!currentUser) return;
        const q = query(collection(db, "users"), where("customID", "==", targetID));
        const snap = await getDocs(q);
        if(snap.empty) return alert(i18n[currentLang].user_not_found);
        
        const targetDoc = snap.docs[0];
        await updateDoc(doc(db, "users", targetDoc.id), {
            requests: arrayUnion({ uid: currentUser.uid, name: document.getElementById('name-input').value, customID: document.getElementById('id-input').value })
        });
        alert(i18n[currentLang].friend_sent);
    }

    function renderFriends(friends = [], requests = []) {
        const reqUI = document.getElementById('request-section');
        const friendUI = document.getElementById('friend-section');

        reqUI.innerHTML = requests.map(r => `
            <div class="friend-card">
                <div class="friend-info">
                    <span>${r.name}</span>
                    <span class="friend-id">#${r.customID}</span>
                </div>
                <div class="friend-actions">
                    <button class="f-btn accept" onclick="handleFriend('${r.uid}', 'accept')">✔</button>
                    <button class="f-btn reject" onclick="handleFriend('${r.uid}', 'reject')">✖</button>
                </div>
            </div>
        `).join('');

        friendUI.innerHTML = friends.map(f => `
            <div class="friend-card">
                <div class="friend-info">
                    <span>${f.name}</span>
                    <span class="friend-id">#${f.customID}</span>
                </div>
                <div class="friend-actions">
                    <span style="font-size:10px; color:var(--go)">Online</span>
                </div>
            </div>
        `).join('');
    }

    window.handleFriend = async (targetUid, action) => {
        const myRef = doc(db, "users", currentUser.uid);
        const mySnap = await getDoc(myRef);
        const myData = mySnap.data();
        const requestItem = myData.requests.find(r => r.uid === targetUid);

        if(action === 'accept') {
            await updateDoc(myRef, {
                friends: arrayUnion(requestItem),
                requests: arrayRemove(requestItem)
            });
            // 雙向好友
            await updateDoc(doc(db, "users", targetUid), {
                friends: arrayUnion({ uid: currentUser.uid, name: myData.displayName, customID: myData.customID })
            });
        } else {
            await updateDoc(myRef, { requests: arrayRemove(requestItem) });
        }
    };

    document.getElementById('find-user-btn').onclick = () => {
        const id = document.getElementById('friend-search-input').value;
        if(id) sendFriendRequest(id);
    };

    // --- 原有計時器與 Firebase 邏輯 (保持不變但整合好友監聽) ---
    onAuthStateChanged(auth, async user => {
        if(user) {
            currentUser = user;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('profile-section').style.display = 'block';
            onSnapshot(doc(db, "users", user.uid), s => {
                if(s.exists()){
                    const d = s.data();
                    allData = d.allData || {};
                    document.getElementById('display-name-sidebar').innerText = d.displayName;
                    document.getElementById('display-id-sidebar').innerText = "#" + d.customID;
                    document.getElementById('name-input').value = d.displayName;
                    document.getElementById('id-input').value = d.customID;
                    renderSolves();
                    renderFriends(d.friends, d.requests); // 渲染好友與申請
                }
            });
        }
    });

    // ... (其餘 genMoves, scramblers, timer 邏輯同上個版本) ...
    // [此處省略部分重複的計時與 Scramble 代碼以維持簡潔，請延用上一版邏輯]

    // 初始化
    updateLanguage();
    // 記得補上上一版的 generateScramble 等初始化呼叫
</script>
</body>
</html>
