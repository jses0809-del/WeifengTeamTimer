<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>WeiFeng Timer - Social Connection</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --text: #fff; --accent: #3742fa; --ready: #ff4757; --go: #2ed573; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* 頂部控制列與漢堡鈕 */
        #top-bar { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
        #menu-btn { font-size: 24px; cursor: pointer; background: none; border: none; color: white; padding: 0 10px; }
        
        /* 側邊社交面板 */
        #side-panel { 
            position: fixed; left: -320px; top: 0; width: 300px; height: 100%; 
            background: var(--panel); transition: 0.3s; z-index: 1000; 
            display: flex; flex-direction: column; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        #side-panel.open { left: 0; }
        .panel-content { padding: 20px; flex-grow: 1; overflow-y: auto; }
        .close-btn { text-align: right; padding: 10px; cursor: pointer; font-size: 20px; }

        /* 社交元素 */
        .section-title { font-size: 0.9rem; color: #888; margin-top: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .friend-item { display: flex; justify-content: space-between; padding: 10px; background: #2a2a2a; margin: 5px 0; border-radius: 4px; font-size: 0.85rem; }
        .friend-time { color: var(--go); font-weight: bold; }
        
        /* 計時與打亂 */
        #scramble { padding: 30px; text-align: center; color: #aaa; font-size: 1.2rem; min-height: 60px; }
        #timer-display { font-size: 18vw; font-weight: bold; margin: auto; font-variant-numeric: tabular-nums; }
        
        /* 輸入與按鈕 */
        input { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; margin-bottom: 5px; box-sizing: border-box; }
        .action-btn { background: var(--accent); border: none; color: white; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        
        /* 聊天室 */
        #chat-area { height: 120px; background: #121212; border-radius: 4px; padding: 5px; font-size: 0.75rem; overflow-y: auto; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="side-panel">
    <div class="close-btn" id="hide-menu">✕</div>
    <div class="panel-content">
        <div class="section-title">我的資訊</div>
        <input type="text" id="name-input" placeholder="更改名字">
        <input type="text" id="id-input" placeholder="專屬 ID (英數)">
        <button class="action-btn" id="save-profile">儲存個人設定</button>

        <div class="section-title">🔍 加好友</div>
        <input type="text" id="search-id" placeholder="輸入好友 ID">
        <button class="action-btn" id="add-friend">發送請求</button>

        <div class="section-title">👥 好友動態</div>
        <div id="friend-feed">目前沒有好友...</div>

        <div class="section-title">💬 聊天室</div>
        <div id="chat-area"></div>
        <input type="text" id="chat-msg" placeholder="輸入訊息...">
    </div>
</div>

<div id="top-bar">
    <button id="menu-btn">☰</button>
    <div id="user-display" style="font-size: 0.9rem;">未登入</div>
    <button id="login-btn" style="background:#444; padding:5px 10px; border:none; color:white; border-radius:4px;">Google 登入</button>
</div>

<div id="scramble">載入中...</div>
<div id="timer-display">0.000</div>

<script type="module">
    // Firebase 初始化與計時器核心邏輯整合
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCIzFMV4CKWBSCHNGOgC1hbzjRpQ-UaQ7s",
        authDomain: "weifengtimer-17ea9.firebaseapp.com",
        projectId: "weifengtimer-17ea9",
        storageBucket: "weifengtimer-17ea9.firebasestorage.app",
        messagingSenderId: "852083740797",
        appId: "1:852083740797:web:4b2326142554cf8654a114"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let timerState = "IDLE", startTime, timerInterval, holdTimeout;

    // --- 介面操作 ---
    const sidePanel = document.getElementById('side-panel');
    document.getElementById('menu-btn').onclick = () => sidePanel.classList.add('open');
    document.getElementById('hide-menu').onclick = () => sidePanel.classList.remove('open');

    // --- 核心：好友與訊息 ---
    async function syncProfile() {
        if(!currentUser) return;
        const name = document.getElementById('name-input').value;
        const customID = document.getElementById('id-input').value.toLowerCase().replace(/[^a-z0-9]/g, '');
        
        // 檢查 ID 是否重複 (省略部分檢查代碼，確保邏輯流暢)
        await setDoc(doc(db, "users", currentUser.uid), {
            displayName: name || currentUser.displayName,
            customID: customID
        }, { merge: true });
        alert("個人資料已更新！");
    }
    document.getElementById('save-profile').onclick = syncProfile;

    // 加好友
    document.getElementById('add-friend').onclick = async () => {
        const id = document.getElementById('search-id').value;
        const q = query(collection(db, "users"), where("customID", "==", id));
        const snap = await getDocs(q);
        if(!snap.empty) {
            await updateDoc(doc(db, "users", currentUser.uid), { friends: arrayUnion(snap.docs[0].id) });
            alert("已成功添加好友！");
        }
    };

    // --- 計時核心與成績廣播 ---
    function stopTimer() {
        clearInterval(timerInterval);
        timerState = "IDLE";
        const finalTime = parseFloat(((performance.now() - startTime) / 1000).toFixed(3));
        // 同步成績到雲端，讓好友看到
        if(currentUser) {
            updateDoc(doc(db, "users", currentUser.uid), { 
                lastTime: finalTime,
                lastUpdate: Date.now() 
            });
        }
        generateScramble();
    }

    // (此處保留之前的 handleKeyDown, handleKeyUp 邏輯...)
    window.addEventListener('keydown', (e) => { if(e.code==='Space') { e.preventDefault(); /* handle timer down */ }});

    // --- 監聽登入 ---
    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUser = user;
            document.getElementById('user-display').innerText = user.displayName;
            document.getElementById('login-btn').style.display = "none";
            // 開始監聽好友動態
            const snap = await getDoc(doc(db, "users", user.uid));
            if(snap.exists() && snap.data().friends) {
                const friendIDs = snap.data().friends;
                onSnapshot(query(collection(db, "users"), where("__name__", "in", friendIDs)), (s) => {
                    const feed = document.getElementById('friend-feed');
                    feed.innerHTML = s.docs.map(d => `
                        <div class="friend-item">
                            <span>${d.data().displayName}</span>
                            <span class="friend-time">${d.data().lastTime || '--'}</span>
                        </div>
                    `).join('');
                });
            }
        }
    });

    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);

    function generateScramble() {
        const moves = ["U", "D", "L", "R", "F", "B"];
        let s = [];
        for(let i=0; i<20; i++) s.push(moves[Math.floor(Math.random()*6)] + ["","'","2"][Math.floor(Math.random()*3)]);
        document.getElementById('scramble').innerText = s.join(" ");
    }
    generateScramble();
</script>
</body>
</html>
